const KEY='m2m_reels_posted_v1';let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
let tab=location.hash==='#done'?'done':'todo';
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
async function copy(text,label,btn){
  try{await navigator.clipboard.writeText(text);toast(label+' 복사됨')}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' 복사됨')}catch(_){toast('길게 눌러서 복사해 주세요')}ta.remove()}
  btn.classList.add('done');setTimeout(()=>btn.classList.remove('done'),1200)}
function fmt(ms){if(!ms)return'';const d=new Date(ms);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}에 올림`}
function mk(t,f){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=t;b.addEventListener('click',f);return b}
function render(){
  const rows=DATA.map(r=>Object.assign({},r,{posted:!!(st[r.n]||(r.pre&&st[r.n]!==0)),postedAt:st[r.n]||null}));
  const todo=rows.filter(r=>!r.posted).sort((a,b)=>b.n-a.n),done=rows.filter(r=>r.posted).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0)||b.n-a.n);
  $('c-todo').textContent=todo.length;$('c-done').textContent=done.length;
  $('tab-todo').setAttribute('aria-selected',tab==='todo');$('tab-done').setAttribute('aria-selected',tab==='done');
  const list=tab==='todo'?todo:done,g=$('grid');g.textContent='';
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=tab==='todo'?'다 올렸어요! 새 릴스가 생기면 여기에 떠요.':'아직 올린 릴스가 없어요. 올린 뒤 "올렸어요"를 누르면 여기로 와요.';g.appendChild(e);return}
  for(const r of list){
    const c=document.createElement('article');c.className='card';
    const v=document.createElement('div');v.className='vid';
    const vd=document.createElement('video');vd.src=r.v+'#t=0.6';vd.controls=true;vd.preload='metadata';vd.playsInline=true;v.appendChild(vd);
    const nb=document.createElement('span');nb.className='num';nb.textContent='#'+r.n;v.appendChild(nb);c.appendChild(v);
    const bd=document.createElement('div');bd.className='body';
    const h=document.createElement('h2');h.className='ttl';h.textContent=r.title;
    const p=document.createElement('p');p.className='cap';p.textContent=r.caption;
    const t=document.createElement('p');t.className='tags';t.textContent=r.tags;bd.append(h,p,t);
    const row=document.createElement('div');row.className='row';
    const b1=mk('제목 복사',()=>copy(r.title,'제목',b1));const b2=mk('캡션+해시태그 복사',()=>copy(r.caption+'\n\n'+r.tags,'캡션',b2));
    const a=document.createElement('a');a.className='btn';a.href=r.v;a.download='릴스_'+String(r.n).padStart(2,'0')+'.mp4';a.textContent='영상 저장';a.style.textAlign='center';a.style.textDecoration='none';
    row.append(b1,b2,a);bd.append(row);
    const row2=document.createElement('div');row2.className='row';
    if(!r.posted){const bp=mk('올렸어요 ✓',()=>{st[r.n]=Date.now();persist();render();toast('올린 릴스로 옮겼어요')});bp.classList.add('main');row2.append(bp)}
    else{const w=document.createElement('span');w.className='when';w.textContent=r.postedAt?fmt(r.postedAt):'이미 올린 릴스';bd.append(w);row2.append(mk('올릴 목록으로 되돌리기',()=>{st[r.n]=0;persist();render();toast('올릴 목록으로 되돌렸어요')}))}
    bd.append(row2);c.appendChild(bd);g.appendChild(c)}
}
$('tab-todo').onclick=()=>{tab='todo';history.replaceState(null,'','#todo');render()};
$('tab-done').onclick=()=>{tab='done';history.replaceState(null,'','#done');render()};
render();
