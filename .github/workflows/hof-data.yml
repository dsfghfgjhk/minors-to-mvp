# 매일 밤 오늘 랭킹 TOP 3를 받아 hof-data 브랜치의 data/hof/latest.json 에 저장해요.
# 명예의 전당 스토리(tools/hof_story.py)가 이 파일을 읽어요. 직접 돌릴 때는 Actions 탭에서 Run workflow.
name: 명예의 전당 데이터
on:
  schedule:
    - cron: '40 12 * * *'   # 매일 21:40 (한국 시간)
  workflow_dispatch:
permissions:
  contents: write
concurrency: hof-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 오늘 TOP 3 받기
        env:
          URL: https://xdoumdgrsbnmktpcvgxd.supabase.co/rest/v1/careers
          KEY: sb_publishable_QCL89LDJdRqOf6FOYoRvtw_62zXa0yL
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          curl -sSf -D head.txt -H "apikey: $KEY" -H "Prefer: count=exact" \
            "$URL?select=name,pos,ovr,mvp,aw,war,ava,col,team,day&day=eq.$DAY&order=mvp.desc,aw.desc,ovr.desc,war.desc,ts.asc&limit=3" -o top.json
          COUNT=$(grep -i '^content-range' head.txt | sed 's#.*/##' | tr -d '\r ')
          mkdir -p out/data/hof
          python3 - "$DAY" "${COUNT:-0}" <<'PY'
          import json,sys
          day,count=sys.argv[1],sys.argv[2]
          top=json.load(open('top.json'))
          json.dump({'day':day,'count':int(count) if count.isdigit() else len(top),'top':top},open('out/data/hof/latest.json','w'),ensure_ascii=False,indent=1)
          print(day,count,[r.get('name') for r in top])
          PY
      - name: hof-data 브랜치에 저장
        run: |
          cd out
          git init -q -b hof-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hof/latest.json
          git commit -qm "명예의 전당 데이터 $(TZ=Asia/Seoul date +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hof-data
