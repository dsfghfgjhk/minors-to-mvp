function ptB(role){if(S.org==='HS'||S.org==='UNIV')return{ace:.95,sub:.55,bench:.25}[role];return{ace:.93,sub:.6,bench:.32,minor:.9}[role]}
function pitType(role){
  if(S.org==='HS'||S.org==='UNIV'||S.org==='ARMY'||role==='minor')return S.pos==='SP'?'SPx':'RPx';
  if(S.pos==='SP')return{ace:'SP',sub:'SP5',bench:'LR'}[role];
  return{ace:'CL',sub:'SU',bench:'MR'}[role];
}
function simBat(eff,L,G,ppg){
  const d=eff-L, o=ovr(), st=S.stats, PA=Math.round(G*ppg);
  const bb=clamp(.085+(st.eye-o)*.0018+d*.0006,.03,.17);
  const avg=clamp(.262+d*.003+(st.con-o)*.0016+rnd(-.02,.02),.15,.385);
  const AB=Math.round(PA*(1-bb)), HR=Math.round(PA*clamp(.024+d*.0009+(st.pow-o)*.0012+rnd(-.004,.004),.002,.09));
  const H=Math.max(HR,Math.round(AB*avg));
  const RBI=Math.round(HR*1.5+PA*.09*(avg/.27)), SB=Math.round(G*clamp((st.spd-48)*.005,0,.35)*(ppg/4.2));
  const war=(d/3.3+1.8+(S.pos==='C'?.6:S.pos==='SS'||S.pos==='CF'?.3:0))*PA/(144*4.2)+rnd(-.15,.15);
  return{t:'B',G,PA,AB,H,HR,RBI,SB,BB:PA-AB,war};
}
function simPit(eff,L,type,f,lg){
  const d=eff-L, o=ovr(), st=S.stats, gs=(LG[lg]?.G||144)/144;let GS=0,G=0,IP=0;
  if(type==='SPx'){GS=Math.round((S.org==='HS'?10:S.org==='UNIV'?12:22)*f);G=GS;IP=GS*clamp((S.org==='HS'?5.5:5.8)+d*.05,3.5,8.5)}
  else if(type==='RPx'){G=Math.round((S.org==='HS'?12:S.org==='UNIV'?15:40)*f);IP=G*1.3}
  else if(type==='SP'){GS=Math.round(rnd(26,30)*gs*f);G=GS;IP=GS*clamp(5.6+(st.sta-L)*.05+d*.03,4,7.6)}
  else if(type==='SP5'){GS=Math.round(14*f);G=GS+Math.round(8*f);IP=GS*5.2+(G-GS)*1.2}
  else if(type==='LR'){G=Math.round(28*f);IP=G*1.4}
  else{G=Math.round((type==='MR'?32:rnd(56,64))*f);IP=G*(type==='MR'?1.2:1)}
  IP=Math.round(IP*3)/3;
  const era=clamp(4.4-d*.11-(st.ctl-o)*.03-(['CL','SU','MR','RPx'].includes(type)?(st.vel-o)*.02:0)+rnd(-.45,.45),.9,9.5);
  const ER=Math.round(era*IP/9), K=Math.round(IP*clamp(7.4+(st.vel-L)*.07+(st.brk-o)*.06+d*.03,3,14.5)/9);
  let W=0,Lo=0,SV=0,HLD=0;
  if(GS>0){const wp=clamp(.45+(4.4-era)*.1,.1,.85);W=Math.round(GS*wp*.75);Lo=Math.max(0,Math.round(GS*.68)-W)}
  if(GS===0||type==='SP5'){W+=Math.round(rnd(1,5)*f);Lo+=Math.round(rnd(1,4)*f)}

function zeroLine(){return isP()?{t:'P',G:0,GS:0,IP:0,ER:0,K:0,W:0,L:0,SV:0,HLD:0,war:0}:{t:'B',G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,BB:0,war:0}}

function genFeed(c,before,p0,p1){
  const items=[], at=fr=>p0+(p1-p0)*clamp(fr,0,1)*.96+.01, d=c._d||0;
  const ms=(key,list,txt)=>{const b=before[key]||0,a=b+(c[key]||0);list.forEach(m=>{if(m>b&&m<=a)items.push({p:at((m-b)/Math.max(1,a-b)),x:txt(m)})})};
  const n=c.G?(d>10?2:d>4?1:0)+(R()<.5?1:0):0;
  if(c.t==='B'){
    ms('HR',[1,10,20,30,40,50],m=>m===1?(isPro()&&S.role!=='minor'&&!S.hist.some(h=>h.top&&h.line.HR>0)?'1군 데뷔 첫 홈런!':'시즌 첫 홈런!'):`시즌 ${m}홈런 고지 돌파`);
    ms('H',[100,150,200],m=>`시즌 ${m}안타 달성`);ms('SB',[20,30,40],m=>`시즌 ${m}도루 달성`);
    shuffle(['4타수 3안타 맹타','끝내기 안타!','멀티 홈런 경기','결승 3점 홈런','5타점 경기','호수비로 실점을 막았어요','5경기 연속 안타']).slice(0,n).forEach(x=>items.push({p:rnd(p0+.05,p1-.02),x}));
    if(c.G&&d<-5)items.push({p:rnd(p0+.1,p1-.05),x:'타격 슬럼프에 빠졌어요',k:'bad'});
  }else{
    ms('W',[1,10,15,20],m=>m===1?'시즌 첫 승!':`시즌 ${m}승 달성`);ms('K',[100,150,200],m=>`시즌 ${m}탈삼진 돌파`);ms('SV',[1,20,30,40],m=>m===1?'시즌 첫 세이브!':`시즌 ${m}세이브`);ms('HLD',[20,30],m=>`시즌 ${m}홀드`);
    shuffle(c.GS>0?['7이닝 무실점 호투','완봉승!','한 경기 11탈삼진','6이닝 노히트 피칭','8이닝 1실점 역투']:['3타자 연속 삼진 세이브','무사 만루 위기 탈출','2이닝 퍼펙트 투구','연투에도 무실점']).slice(0,n).forEach(x=>items.push({p:rnd(p0+.05,p1-.02),x}));
    if(c.G&&d<-5)items.push({p:rnd(p0+.1,p1-.05),x:'연이은 부진으로 자신감이 떨어졌어요',k:'bad'});
  }
  return items;
}
function startSeason(){
  ensureRole();
  const pl=playLg(), L=LG[pl].L, fl=S.flags;
  let inj=null;
  const injP=.07+(S.trait==='glass'?.1:0)-(S.trait==='iron'?.04:0)+(fl.hurt?.45:0);
  if(fl.surgery)inj={type:'major',p:.04};
  else if(R()<injP)inj=R()<.25?{type:'major',p:rnd(.1,.4)}:{type:'minor',p:rnd(.55,.85)};
  const natBoost=S.nat&&S.nat.joined===false?1:0;
  const eff1=ovr()+(S.morale-60)/10+rnd(-3,3)-(fl.slow?2:0)-(fl.newform?2:0)-(fl.distracted?1:0)+natBoost;
  const f1=inj&&inj.type==='major'?(fl.surgery?.1:inj.p):.5;
  const c1=simChunk(eff1,f1);c1._d=eff1-L;
  const feed=[];
  if(c1.G)feed.push({p:.02,x:S.org==='HS'||S.org==='UNIV'?(S.role==='ace'?'개막전 선발 출전!':'개막전 엔트리에 이름을 올렸어요'):S.role==='minor'?(S.org==='US'?'마이너리그에서 시즌을 시작해요':'2군에서 시즌을 시작해요'):S.org==='ARMY'?'상무 유니폼을 입고 첫 경기에 나섰어요':S.pos==='SP'&&S.role==='ace'?'개막 시리즈 선발 등판!':S.role==='ace'?'개막전 선발 라인업에 이름을 올렸어요':'1군 엔트리에 합류했어요'});
  feed.push(...genFeed(c1,{},0,.5));
  if(inj&&inj.type==='major')feed.push({p:fl.surgery?.03:inj.p,x:fl.surgery?'수술 후 재활에 들어갔어요':'큰 부상으로 시즌 아웃됐어요',k:'bad'});
  let mom=null;
  if(!(inj&&inj.type==='major')&&c1.G>0)mom={i:ri(0,(isP()?MP:MB).length-1),done:false,ok:null};
  S.prog={p:0,pl,L,eff1,c1,c2:null,mom,inj,feed,totalG:LG[pl].G,fin:null,wp:clamp(.32+(S.org==='ARMY'?.62:teamS(S.team))*.32+(eff1-L)*.004,.25,.72)};
  S.phase='progress';
}
function rollSecond(bonus){
  const P=S.prog, inj=P.inj;if(P.c2)return;
  let f2=.5;
  if(inj&&inj.type==='major')f2=0;else if(inj&&inj.type==='minor')f2=.5*rnd(.4,.7);
  const eff2=P.eff1+bonus+rnd(-1.5,1.5)+(S.flags.slow?2:0)+(S.flags.newform?3:0);
  const c2=f2>0?simChunk(eff2,f2):zeroLine();
  c2._d=eff2-P.L;
  P.c2=c2;P.feed.push(...genFeed(c2,P.c1,.5,1));
  if(inj&&inj.type==='minor')P.feed.push({p:inj.p,x:'부상으로 한 달 가까이 이탈했어요',k:'bad'});
  const tot=derive(addLine(P.c1,c2)), org=S.org;
  const n=org==='HS'?16:org==='US'?15:10, ts=org==='ARMY'?.62:teamS(S.team);
  const my=ts*10+(tot.war-2)*.6+rnd(-2.5,2.5)+(P.mom&&P.mom.ok?.5:0);let rank=1;for(let i=0;i<n-1;i++)if(rnd(0,10)+rnd(-2.5,2.5)>my)rank++;

  P.fin={tot,rank,n,champ,eff2};
  if(rank===1&&(isPro()||org==='ARMY'))P.feed.push({p:.9,x:'정규시즌 1위 확정!',k:'gold'});
  if(champ)P.feed.push({p:.985,x:`${CHAMP[org]}!`,k:'gold'});
  else if(rank<=5&&(isPro()||org==='ARMY'))P.feed.push({p:.96,x:`정규시즌 ${rank}위로 마쳤어요`});
}
function momP(o){const L=LG[S.prog.pl].L;return clamp(.5+(S.stats[o.s]-(L+o.d))/40+(S.trait==='clutch'?.06:0),.1,.9)}
function chooseMoment(i){

/* ================= season end ================= */
function grow(pt,lgL,bonus){
  const a=S.age, keys=Object.keys(S.stats), ob=ovr(), late=S.trait==='late';
  const ra=late?(a<=20?.12:a<=24?.21:a<=28?.16:a<=31?.05:0):(a<=19?.2:a<=22?.22:a<=25?.16:a<=28?.08:a<=30?.03:0);
  const lf=.85+(lgL-50)/80, pf=.35+.65*clamp(pt,0,1);
  let g=Math.max(0,S.pot-ob)*ra*lf*pf+bonus*.35+(S.flags.reset?1:0);
  if(ob+g>S.pot+2)g=Math.max(0,S.pot+2-ob);
  keys.forEach(k=>{S.stats[k]+=g*(S.focus.includes(k)?1.45:.82)*rnd(.7,1.3)});
  const da=late?a-32:a-30;
  if(da>0){const dec=da*.55*(S.trait==='iron'?.7:1);keys.forEach(k=>{const m=['spd','vel','sta'].includes(k)?1.5:['eye','ctl','men'].includes(k)?.6:1;S.stats[k]-=dec*m*rnd(.6,1.4)})}
  keys.forEach(k=>S.stats[k]=clamp(S.stats[k],15,99));
  S.maxOvr=Math.max(S.maxOvr,ovr());
}
function fullIP(type){if(type==='SPx')return S.org==='HS'?55:S.org==='UNIV'?70:128;if(type==='RPx')return S.org==='HS'?16:S.org==='UNIV'?20:52;return S.pos==='SP'?170:65}
function finishSeason(){

/* ================= retire & hof ================= */
function totals(){
  const rows=S.hist.filter(h=>h.top);
  if(isP()){const t={G:0,W:0,L:0,IP:0,ER:0,K:0,SV:0,HLD:0,war:0};rows.forEach(h=>{const l=h.line;if(l.t!=='P')return;['G','W','L','IP','ER','K','SV','HLD'].forEach(k=>t[k]+=l[k]||0);t.war+=h.war});t.era=t.IP?t.ER*9/t.IP:0;t.war=r1(t.war);return t}
  const t={G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,war:0};rows.forEach(h=>{const l=h.line;if(l.t!=='B')return;['G','PA','AB','H','HR','RBI','SB'].forEach(k=>t[k]+=l[k]||0);t.war+=h.war});t.avg=t.AB?t.H/t.AB:0;t.war=r1(t.war);return t;
}
const awardCount=()=>S.tro.filter(t=>t.k==='a').length;
const trophyCount=()=>S.tro.filter(t=>t.k==='t').length;
function loadHof(){try{return JSON.parse(localStorage.getItem(HOF)||'[]')}catch(e){return[]}}
function retire(){
  const t=totals();
  const list=loadHof();list.push({name:S.name,pos:SUBPOS[S.pos].n,mvp:S.mvp,maxOvr:S.maxOvr,aw:awardCount(),war:t.war,y:S.year});
  list.sort((a,b)=>(b.mvp-a.mvp)||(b.maxOvr-a.maxOvr)||(b.aw-a.aw)||(b.war-a.war));
  try{localStorage.setItem(HOF,JSON.stringify(list.slice(0,30)))}catch(e){}
  addNews(`${S.name}, ${S.hist.length}시즌 선수 생활 마치고 은퇴`,'retire',3);
  S.phase='retired';ui.sheet=null;
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===2)S=s}catch(e){}}
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}
function importCode(code){try{const s=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(s&&s.v===2&&s.stats){S=s;return true}}catch(e){}return false}

/* ================= render helpers ================= */
function toast(t){ui.toast=t;if(!HAS_DOM)return;clearTimeout(toast._t);toast._t=setTimeout(()=>{ui.toast=null;const el=document.querySelector('.toast');if(el)el.remove()},2400)}
const avaImg=(av=S.avatar,team=S.team)=>`<img src="${avatarURL(av,TC[team]||'#1f4fa3')}" alt="">`;
const head=(title,sub)=>`<header class="hd"><div><h1>${esc(title)}</h1>${sub?`<small>${esc(sub)}</small>`:''}</div><button class="icbtn" data-a="settings" aria-label="설정">${ICON.gear}</button></header>`;
function statRows(l){
  if(!l||!l.G)return[['출전','기록 없음']];
  l=derive(l);
  if(l.t==='B')return[['출전',`${l.G}경기 · ${l.PA}타석`],['타율 · 출루율 · 장타율',`${avg3(l.avg)} / ${avg3(l.obp)} / ${avg3(l.slg)}`],['홈런 · 타점 · 도루',`${l.HR} · ${l.RBI} · ${l.SB}`],['WAR',l.war.toFixed(1)]];
  return[['출전',`${l.G}경기${l.GS?` · 선발 ${l.GS}`:''}`],['승 · 패',`${l.W}승 ${l.L}패${l.SV?` · ${l.SV}세이브`:''}${l.HLD?` · ${l.HLD}홀드`:''}`],['평균자책점',`${l.era.toFixed(2)} · ${ipStr(l.IP)}이닝`],['탈삼진',`${l.K}개`],['WAR',l.war.toFixed(1)]];
}
function careerTrio(){const t=totals();return isP()?[['1군 경기',t.G],['통산 승',t.W],['탈삼진',t.K]]:[['1군 경기',t.G],['통산 홈런',t.HR],['타점',t.RBI]]}
function todos(){
  const L=[], off=S.off;
  if(off&&!off.decided){
    const ext=off.offers.filter(x=>x.contract&&x.team!==S.team);
    if(off.kind==='draft')L.push({a:'go-season',ic:'mail',b:'드래프트 결과가 발표됐어요',s:off.offers[0].label+' · '+off.offers[0].sub,dot:1});
    else if(ext.length)L.push({a:'go-season',ic:'mail',b:ext.length>1?`구단 ${ext.length}곳에서 연락이 왔어요`:'구단에서 연락이 왔어요',s:ext.map(x=>x.team).join(', '),dot:1,emb:ext[0].team});
    L.push({a:'go-season',ic:'flag',b:'오프시즌 결정이 남았어요',s:off.offers.map(x=>x.label).slice(0,2).join(' · '),dot:1});
  }
  if(S.nat&&S.nat.joined==null)L.push({a:'nat',ic:'medal',b:'태극마크 소식이 왔어요',s:`${S.year} ${S.nat.ev}`,dot:1});
  if(S.tp&&!S.tp.done)L.push({a:'tp',ic:'trend',b:'선택의 순간이 왔어요',s:tpTitle(tpDef(S.tp.id)),dot:1,blue:1});
  L.push({a:'go-player',ic:'trend',b:'훈련 포커스',s:S.focus.map(k=>SN[k]).join(', '),blue:1});
  return L;
}
const itemHTML=t=>`<button class="item" data-a="${t.a}"><span class="ic ${t.blue?'blue':''}">${t.emb?emblem(t.emb,28):ICON[t.ic]}</span><span><b>${esc(t.b)}${t.dot?'<i class="dot"></i>':''}</b><small>${esc(t.s)}</small></span><span class="chev">${ICON.chev}</span></button>`;

/* ================= render: create ================= */
function renderCreate(){
  const s=C.step, sch=tnames('HS')[C.school], dots=`<div class="stepnum">STEP ${s+1} <span>/ 4</span></div>`;
  const nav=`<div class="nav"><button class="icbtn" data-a="c-back" aria-label="뒤로" ${s===0?'style="visibility:hidden"':''}>${ICON.back}</button>${dots}<span></span></div>`;
  let body='',btn='';
  if(s===1){
    body=`<div><p class="eyebrow">${esc(sch)} 유니폼을 입혀 볼게요</p><h1 class="ttl">선수의 얼굴을<br>골라 주세요</h1></div>
    <div class="sec" style="padding:16px;gap:12px;background:var(--fill)"><div class="pcard"><div class="ava" style="background:var(--card)">${avaImg(AVS[C.avatar],sch)}</div><b>${esc(C.name||'이름 없는 신인')} · No.${esc(C.num||'?')}</b></div>
    <div class="avgrid">${AVS.map((a,i)=>`<button class="avopt ${C.avatar===i?'on':''}" data-a="c-ava" data-v="${i}" aria-label="모습 ${i+1}"><img src="${avatarURL(a,TC[sch])}" alt=""></button>`).join('')}</div></div>`;
    btn=`<button class="btn" data-a="c-next">이 얼굴로 정할게요</button>`;
  }else if(s===0){
    body=`<div><p class="eyebrow">나의 야구 인생 · 고1, 16세 봄</p><h1 class="ttl">어떤 선수로<br>뛰어 볼까요?</h1></div>
    <div class="f2"><div class="field"><label for="c-name">이름</label><input id="c-name" maxlength="10" placeholder="닉네임을 추천해요" value="${esc(C.name)}" autocomplete="off"></div>
    <div class="field"><label for="c-num">등번호</label><input id="c-num" type="number" min="0" max="99" value="${esc(C.num)}" placeholder="0~99"></div></div>
    <div class="sec" style="padding:4px 16px;gap:0;background:var(--fill)">
      <div class="opt-row"><span>포지션</span><select id="c-pos" aria-label="포지션">${POSORDER.map(p=>`<option value="${p}" ${C.pos===p?'selected':''}>${p} ${SUBPOS[p].n}</option>`).join('')}</select></div>
      <div class="opt-row"><span>투타</span><div class="seg">${['우투우타','우투좌타','좌투좌타'].map(h=>`<button class="${C.hand===h?'on':''}" data-a="c-hand" data-v="${h}">${h}</button>`).join('')}</div></div>
      <div class="opt-row"><span>국적</span><b style="font-size:15px">대한민국</b></div>
      <div class="opt-row"><span>고등학교</span><select id="c-school" aria-label="고등학교">${TEAMS.HS.map(([n,,r],i)=>`<option value="${i}" ${C.school===i?'selected':''}>${n} · ${r}</option>`).join('')}</select></div>
    </div>
    <p class="desc" style="font-size:12px">실제 고교 야구 명문고 이름만 빌려 왔어요. 경기 결과와 선수, 기록은 모두 가상이에요.</p>`;
    btn=`<button class="btn" data-a="c-next">다음</button>`;
  }else if(s===2){
    if(!C.cands)C.cands=makeCands(C.pos);
    const keys=keysOf(C.pos), w=SUBPOS[C.pos].w;
    body=`<div><p class="eyebrow">${esc(C.name||'이름 없는 신인')} · ${SUBPOS[C.pos].n}</p><h1 class="ttl">${SUBPOS[C.pos].g==='P'?'투구':'타격'} 스타일을<br>정해 주세요</h1><p class="desc" style="margin-top:6px">세 후보 모두 종합 능력치는 45예요. 능력치 분포만 다르고, 잠재력은 숨겨져 있어요.</p></div>
    ${C.cands.map((c,i)=>{const top2=keys.slice().sort((a,b)=>c.stats[b]-c.stats[a]).slice(0,2);
      return`<button class="stycard ${C.pick===i?'on':''}" data-a="c-pick" data-v="${i}"><div class="t"><span><b>${c.style}</b><br><span class="muted" style="font-size:13px">${c.desc}</span></span><span class="check">${C.pick===i?ICON.check:''}</span></div>
      <div class="tags">${top2.map(k=>`<span class="tag">${SN[k]} ${c.stats[k]}</span>`).join('')}</div>
      ${C.pick===i?`<div class="bars">${keys.map(k=>`<div class="bar ${w[k]>=.2?'focus':''}"><span>${SN[k]}</span><span class="tr"><i style="width:${c.stats[k]}%"></i></span><span>${c.stats[k]}</span></div>`).join('')}</div>`:''}</button>`}).join('')}
    <button class="btn gray sm" data-a="c-reroll">후보 다시 뽑기</button>`;
    btn=`<button class="btn" data-a="c-next">이 스타일로 갈게요</button>`;
  }else{
    const c=C.cands[C.pick], keys=keysOf(C.pos);
    body=`<div><p class="eyebrow">${c.style} ${SUBPOS[C.pos].n} · OVR 45</p><h1 class="ttl">어디에 땀을<br>쏟아 볼까요?</h1><p class="desc" style="margin-top:6px">훈련 포커스를 2개까지 고를 수 있어요. 고른 능력치가 훨씬 빨리 자라고, 선택의 순간에 바뀔 수도 있어요.</p></div>
    <div>${keys.map(k=>`<button class="pickrow" data-a="c-focus" data-v="${k}"><span>${SN[k]}${SUBPOS[C.pos].w[k]>=.2?' <span class="badge gray">포지션 핵심</span>':''}</span><span class="v">${c.stats[k]}<span class="check ${C.focus.includes(k)?'on':''}">${C.focus.includes(k)?ICON.check:''}</span></span></button>`).join('')}</div>`;
    btn=`<button class="btn" data-a="c-make" ${C.focus.length?'':'disabled'}>스카우팅 리포트 보기</button>`;
  }
  let ov='';
  if(C.confirm){const c=C.cands[C.pick];
    ov=`<div class="ov" data-a="c-noconfirm"><div class="sheet" role="dialog" aria-label="스카우팅 리포트"><button class="icbtn x" data-a="c-noconfirm" aria-label="닫기">${ICON.close}</button><p class="eyebrow" style="font-weight:700;color:var(--accent)">스카우팅 리포트</p>
    <div class="pcard"><div class="ava">${avaImg(AVS[C.avatar],sch)}</div><div><div style="font-size:20px;font-weight:800">${esc(C.name||'이름 없는 신인')} <span class="badge">${SUBPOS[C.pos].n}</span></div><div class="muted" style="font-size:13px">${c.style} · 등번호 ${parseInt(C.num)>=0&&C.num!==''?clamp(parseInt(C.num),0,99):'자동'} · 16세</div></div></div>
    <div class="rows"><div class="row"><span>소속</span><span>${emblem(sch,20)} ${sch}</span></div><div class="row"><span>국적 · 투타</span><span>대한민국 · ${C.hand}</span></div><div class="row"><span>능력치 합 · OVR</span><span>${Object.values(c.stats).reduce((a,b)=>a+b,0)} · 45</span></div><div class="row"><span>훈련 포커스</span><span>${C.focus.map(k=>SN[k]).join(', ')}</span></div><div class="row"><span>잠재력</span><span>스카우트도 아직 몰라요</span></div></div>
    <div class="btns"><button class="btn gray" data-a="c-noconfirm">다시 고르기</button><button class="btn play" data-a="c-start">입학하기</button></div></div></div>`}
  return`<div class="page">${nav}<div class="stack">${body}</div><div></div>${btn}</div>${ov}${hofMini()}`;
}
function hofMini(){const l=loadHof().slice(0,5);if(!l.length||C.step)return'';return`<section class="sec"><h2>명예의 전당 <span>이 기기</span></h2>${hofTable(l)}</section>`}
function hofTable(l){return l.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>선수</th><th class="r">MVP</th><th class="r">최고</th><th class="r">개인상</th><th class="r">WAR</th></tr></thead><tbody>${l.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h.name)} <span class="muted">${esc(h.pos)}</span></td><td class="r">${h.mvp}</td><td class="r">${h.maxOvr}</td><td class="r">${h.aw}</td><td class="r">${h.war}</td></tr>`).join('')}</tbody></table></div>`:'<p class="desc">아직 은퇴한 선수가 없어요.</p>'}

/* ================= render: app tabs ================= */

  const d=ovr()-S.prevOvr;
  return`<div class="pcard" style="grid-template-columns:auto 1fr auto"><div class="ava">${avaImg()}</div><div style="min-width:0"><div class="who">${emblem(S.team,16)} ${esc(teamLabel())}</div><div style="font-size:20px;font-weight:800;overflow-wrap:anywhere">${esc(S.name)} <span class="badge">${SUBPOS[S.pos].n}</span></div><div class="muted" style="font-size:13px">No.${S.num} · ${S.age}세 · ${esc(S.style)}</div></div><div class="ovrbox"><b>${ovr()}</b><small>OVR</small>${S.hist.length&&d?`<em class="${d>0?'up':'dn'}">${sgn(d)}</em>`:''}</div></div>`;
}

    ${S.nat&&S.nat.joined?`<div class="row"><span>대표팀</span><span>${S.year} ${S.nat.ev} 합류</span></div>`:''}`;
}
function tabHome(){
  return`<section class="scoreboard"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="lg">${S.year} · ${esc(stageTxt()||LG[playLg()].n)}</span><button class="icbtn" data-a="settings" aria-label="설정" style="color:var(--chalk)">${ICON.gear}</button></div>

function tabNews(){

function tabSeason(){
  const L=S.last, off=S.off;let h=head('시즌');
  if(L){const l=derive(L.line);
    h+=`<section class="sec"><p class="eyebrow">${L.y} 시즌 · ${esc(L.team)}${L.role==='minor'?' 2군':''}</p>
    <div class="ttl" style="font-size:22px;margin-top:-8px">${!l.G?'출전 기록이 없어요':l.t==='B'?`타율 ${avg3(l.avg)} · ${l.HR}홈런`:`${l.W}승 ${l.L}패 · 평균자책점 ${l.era.toFixed(2)}`}</div>
    <div class="delta ${L.oa-L.ob>0?'up':'muted'}" style="margin-top:-10px">종합 능력치 ${sgn(L.oa-L.ob)}</div>
    <div class="trio">${(l.t==='B'?[['출전',l.G+'경기'],['타점',l.RBI],['WAR',l.war.toFixed(1)]]:[['출전',l.G+'경기'],['탈삼진',l.K],['WAR',l.war.toFixed(1)]]).map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div></section>`;}
  if(off){
    h+=`<section class="sec"><p class="eyebrow">오프시즌</p><div class="ttl" style="margin-top:-8px">${off.title}</div>${off.desc?`<p class="desc">${esc(off.desc)}</p>`:''}
    ${off.rows.length?`<div class="rows">${off.rows.map(([a,b])=>`<div class="row"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}</div>`:''}</section>`;
    if(off.decided)h+=`<section class="sec"><h2>결정 완료</h2><div class="list"><div class="item" style="cursor:default"><span class="ic blue">${ICON.check}</span><span><b>${esc(off.decided)}</b><small>${S.year} 시즌부터 적용돼요</small></span><span></span></div></div></section>`;
    else{
      h+=`<section class="sec"><h2>${off.offers.some(x=>x.contract)?'협상 테이블':'선택지'} <span>${off.offers.length}개</span></h2><div class="list">${off.offers.map(x=>`<button class="item" data-a="offer" data-v="${x.id}"><span class="ic">${x.contract?emblem(x.team,28):ICON.flag}</span><span><b>${esc(x.label)}</b><small>${esc(x.sub||'')}</small></span><span class="chev">${ICON.chev}</span></button>`).join('')}</div></section>`;
      if(off.req)h+=`<section class="sec"><h2>직접 트레이드 요청</h2><p class="desc">요청이 받아들여지면 다른 구단의 트레이드 제안이 도착해요. 요청하면 사기가 조금 떨어지고, 한 겨울에 한 번만 할 수 있어요.</p><button class="btn gray sm" data-a="reqtrade">트레이드 요청하기</button></section>`;
    }
  }
  if(S.tp&&!S.tp.done)h+=`<section class="sec"><p class="eyebrow">선택의 순간</p><div style="font-size:17px;font-weight:800;margin-top:-8px">${esc(tpTitle(tpDef(S.tp.id)))}</div><button class="btn sm" data-a="tp">선택하러 가기</button></section>`;
  if(S.nat&&S.nat.joined==null)h+=`<section class="sec"><p class="eyebrow">태극마크</p><div style="font-size:17px;font-weight:800;margin-top:-8px">${S.year} ${esc(S.nat.ev)} 최종 엔트리</div><button class="btn sm" data-a="nat">합류 여부 정하기</button></section>`;
  h+=`<section class="sec"><h2>${S.year} 시즌</h2><div class="rows">${seasonInfoRows()}</div></section>`;
  return h;
}

    <div class="row"><span>명성</span><span>${Math.round(S.fame)}</span></div>

function scaleLine(c,f){const o={};for(const k in c)o[k]=(typeof c[k]==='number'&&k[0]!=='_')?c[k]*f:c[k];return o}
function liveLine(P){const p=P.p;const l=p<=.5?scaleLine(P.c1,p/.5):(P.c2?addLine(P.c1,scaleLine(P.c2,(p-.5)/.5)):P.c1);return derive(l)}
function liveCells(l){
  const g=l.G>=.5, m=v=>g?Math.round(v):'-';
  if(l.t==='B')return[['타율',g&&l.AB>=1?avg3(l.avg):'-'],['홈런',m(l.HR)],['타점',m(l.RBI)]];
  const era=g&&l.IP>=1?l.era.toFixed(2):'-';
  if(S.pos==='RP'&&S.role==='ace')return[['세이브',m(l.SV)],['평균자책점',era],['탈삼진',m(l.K)]];
  if(S.pos==='RP'&&S.role==='sub')return[['홀드',m(l.HLD)],['평균자책점',era],['탈삼진',m(l.K)]];
  return[['승',m(l.W)],['평균자책점',era],['탈삼진',m(l.K)]];
}
function renderProgress(){

  const showMom=P.mom&&!P.mom.done&&p>=.5;
  const l=liveLine(P), gp=Math.round(p*P.totalG), W=Math.round(gp*(P.wp||.5));
  let mom='';
  if(showMom){const ev=(isP()?MP:MB)[P.mom.i];
    mom=`<div class="mom"><p class="eyebrow" style="color:var(--accent);font-weight:700">결정적 순간 · ${esc(ev.title)}</p><div style="font-size:17px;font-weight:800;line-height:1.5">${esc(ev.txt)}</div>
    <div style="display:grid;gap:8px">${ev.o.map((o,i)=>`<button class="choice" data-a="mom" data-v="${i}"><b>${esc(o.t)}</b><small>${SN[o.s]} ${Math.floor(S.stats[o.s])} 사용</small><em>성공률 ${Math.round(momP(o)*100)}%</em></button>`).join('')}</div></div>`}
  return`<div class="page">
    <section class="scoreboard"><span class="lg">${S.year} · ${esc(teamLabel())} · ${LG[P.pl].n}</span>
      <div class="sbgrid"><div><small>경기</small><b>${gp}<span>/${P.totalG}</span></b></div><div><small>팀 성적</small><b>${W}-${gp-W}</b></div><div><small>WAR</small><b>${l.G>=.5?l.war.toFixed(1):'-'}</b></div></div>
      <div class="sbgrid">${liveCells(l).map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div>
      <div class="inn" aria-label="시즌 진행 ${Math.round(p*100)}%">${[...Array(9)].map((_,i)=>`<i class="${p>=(i+1)/9-.001?'on':''}">${i+1}</i>`).join('')}</div>

    <h1 class="ttl">${showMom?'승부처가 찾아왔어요':st}</h1>
    <div class="stack" style="gap:10px">${mom}<div class="feed">${items.map(f=>`<div class="fi ${f.k||''} ${p-f.p<.03?'new':''}"><span class="gm">${Math.max(1,Math.round(f.p*P.totalG))}G</span><span>${esc(f.x)}</span></div>`).join('')}</div></div>
    ${showMom?`<button class="btn gray" data-a="mom-skip">이번 승부는 넘어가기</button>`:`<button class="btn gray" data-a="skip">시즌 끝까지 건너뛰기</button>`}</div>`;

  if(!S)app.innerHTML=renderCreate();
  else app.innerHTML=({app:renderApp,progress:renderProgress,summary:renderSummary,nat:renderNatRes,retired:renderRetired}[S.phase]||renderApp)();
  if(ui.toast)app.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(ui.toast)}</div>`);
  if(S&&S.phase==='progress'&&!timer)timer=setInterval(tick,90);
  if((!S||S.phase!=='progress')&&timer){clearInterval(timer);timer=null}
  if(ui.sheet&&ui.sheet.type==='offer')initHold();
}
function tick(){
  const P=S&&S.prog;if(!P||S.phase!=='progress'){clearInterval(timer);timer=null;return}
  if(P.mom&&!P.mom.done&&P.p>=.5)return;
  P.p=Math.min(1,P.p+.0105);
  if(P.p>=.5&&P.mom&&!P.mom.done){P.p=.5;save();render();return}
  if(P.p>=.5&&!P.c2)rollSecond(0);
  if(P.p>=1){finishSeason();save();render();window.scrollTo(0,0);return}
  render();
}

/* ================= hold to stamp ================= */
function initHold(){
  const b=document.getElementById('holdbtn');if(!b||b._init)return;b._init=1;let t=null;
  const start=e=>{e.preventDefault();b.classList.add('holding');clearTimeout(t);t=setTimeout(()=>{b.classList.remove('holding');act('take',b.dataset.v)},950)};
  const stop=()=>{b.classList.remove('holding');clearTimeout(t)};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('take',b.dataset.v)}});
  b.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ================= events ================= */
function act(a,v){
  let top=false;
  if(a==='c-ava')C.avatar=+v;
  else if(a==='c-hand')C.hand=v;
  else if(a==='c-back')C.step=Math.max(0,C.step-1);
  else if(a==='c-next'){C.step++;top=true}
  else if(a==='c-pick')C.pick=+v;
  else if(a==='c-reroll'){C.cands=makeCands(C.pos);C.pick=0}
  else if(a==='c-focus'){const i=C.focus.indexOf(v);if(i>=0)C.focus.splice(i,1);else{if(C.focus.length>=2)C.focus.shift();C.focus.push(v)}}
  else if(a==='c-make')C.confirm=true;
  else if(a==='c-noconfirm')C.confirm=false;
  else if(a==='c-start'){C.confirm=false;newCareer();ui.tab='home';top=true}
  else if(a==='tab'){ui.tab=v;top=true}
  else if(a==='go-season'){ui.tab='season';top=true}
  else if(a==='go-player'){ui.tab='player';top=true}
  else if(a==='settings'){ui.sheet={type:'settings'};ui.settingsReset=false}
  else if(a==='close-sheet')ui.sheet=null;
  else if(a==='offer')ui.sheet={type:'offer',id:+v};
  else if(a==='take'){const x=S.off.offers[+v];ui.sheet=null;if(x)applyOffer(x);if(S.phase==='retired')top=true}
  else if(a==='reject'){S.off.offers.splice(+v,1);S.off.offers.forEach((x,i)=>x.id=i);ui.sheet=null;toast('제안을 거절했어요');if(!S.off.offers.length)S.off=buildOff()}
  else if(a==='reqtrade')requestTrade();
  else if(a==='tp')ui.sheet={type:'tp'};
  else if(a==='tp-pick')chooseTP(+v);
  else if(a==='nat')ui.sheet={type:'nat'};
  else if(a==='nat-pick'){S.nat.joined=v==='1';ui.sheet=null;if(S.nat.joined)addNews(`${S.name}, ${S.year} ${S.nat.ev} 대표팀 승선`,'nat');toast(S.nat.joined?'대표팀에 합류하기로 했어요':'소속팀에 남기로 했어요')}
  else if(a==='go'){
    if(S.off&&!S.off.decided){ui.tab='season';toast('오프시즌 결정을 먼저 해 주세요');top=true}
    else if(S.nat&&S.nat.joined==null)ui.sheet={type:'nat'};
    else{ui.sheet=null;startSeason();top=true}
  }
  else if(a==='mom')chooseMoment(+v);
  else if(a==='mom-skip'){const P=S.prog;P.mom.done=true;rollSecond(0)}
  else if(a==='skip'){const P=S.prog;if(P.mom&&!P.mom.done)P.mom.done=true;rollSecond(0);P.p=1;finishSeason();top=true}
  else if(a==='sum-ok'){S.phase=S.natRes?'nat':'app';ui.tab='home';top=true}
  else if(a==='nat-ok'){S.natRes=null;S.phase='app';ui.tab='home';top=true}
  else if(a==='rec-tab')ui.recTab=v;
  else if(a==='rec-cat')ui.recCat=v;
  else if(a==='copy-exp'){const t=document.getElementById('exp'), txt=t?t.value:'';
    const fb=()=>{if(t){t.focus();t.select()}toast('코드가 선택됐어요. 길게 눌러 복사해 주세요');render()};
    try{navigator.clipboard.writeText(txt).then(()=>{toast('저장 코드를 복사했어요');render()},fb)}catch(e){fb()}return}
  else if(a==='do-imp'){const t=document.getElementById('imp');if(t&&importCode(t.value)){ui.sheet=null;ui.tab='home';toast('커리어를 불러왔어요')}else{toast('저장 코드를 확인해 주세요');render();return}}
  else if(a==='reset')ui.settingsReset=true;
  else if(a==='reset-no')ui.settingsReset=false;
  else if(a==='reset-yes'){ui.settingsReset=false;ui.sheet=null;S=null;try{localStorage.removeItem(KEY)}catch(e){}Object.assign(C,{step:0,cands:null,pick:0,focus:[],confirm:false});top=true}
  if(S)save();
  render();if(top&&HAS_DOM)window.scrollTo(0,0);
}
if(HAS_DOM){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.classList.contains('ov')&&e.target!==b)return;
    if(b.disabled)return;
    act(b.dataset.a,b.dataset.v);
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='c-pos'){C.pos=e.target.value;C.cands=null;C.pick=0;C.focus=[];render()}
    if(e.target.id==='c-school'){C.school=+e.target.value;render()}
  });
  document.addEventListener('input',e=>{if(e.target.id==='c-name')C.name=e.target.value;if(e.target.id==='c-num')C.num=e.target.value});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}});
  const start=data=>{if(data&&data.S){S=data.S;if(data.C)Object.assign(C,data.C)}else load();render()};
  window.claude?.hot?.snapshot?.(()=>({S,C:{...C}}));
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
</body>
