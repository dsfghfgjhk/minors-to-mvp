.rk-pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end}

.rk-pc.first{background:linear-gradient(#fff3d1,#fffdf6 75%);border-color:#f0d58a;padding-top:22px}
.rk-pc .rk-n{position:absolute;left:12px;top:10px;font-family:var(--f-num);font-weight:700;color:var(--muted)}.rk-pc.first .rk-n{color:var(--gold)}
.rk-av{width:40px;height:52px;display:grid;place-items:center;flex:none}.rk-av img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.rk-pc .rk-av{width:52px;height:66px}.rk-pc.first .rk-av{width:62px;height:80px}
.rk-pc b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-pc small{font-size:12px;color:var(--muted);white-space:nowrap}
.rk-mvp i{font-style:normal;font-size:11px;font-family:var(--f-body);margin-right:1px}
.rk-pc .rk-mvp b{font-size:16px;white-space:normal}
.rk-mvp{display:inline-flex;align-items:center;gap:3px;background:var(--gold-s);color:var(--gold);border-radius:999px;padding:3px 10px;font-family:var(--f-num);font-weight:700;font-size:16px}.rk-mvp svg{width:16px;height:16px}
.rk-list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rk-it{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}.rk-it:first-child{border-top:0}
.rk-it .rk-n{font-family:var(--f-num);font-weight:700;color:var(--muted);min-width:22px;text-align:center}
.rk-nm{display:grid;min-width:0}.rk-nm b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-nm small{font-size:12.5px;color:var(--muted)}
.rk-it .rk-mvp{background:none;padding:0;font-size:18px}
.rk-it.me,.rk-pc.me{box-shadow:inset 0 0 0 2px var(--blue)}
.rk-empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.6;background:var(--fill);border-radius:18px;margin:0}
.rk-note,.rk-foot{font-size:12.5px;color:var(--muted);margin:0;text-align:center;line-height:1.5}
.rk-field{position:relative;aspect-ratio:1/1.08;border-radius:18px;overflow:hidden;background:#2e6b2b}.rk-field>svg{position:absolute;inset:0;width:100%;height:100%}
.rk-spot{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:1px;text-align:center;width:84px}
.rk-spot b{font-size:12px;color:#fff;text-shadow:0 1px 2px #0009;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-spot small{font-size:10.5px;color:#e8f5e6;display:inline-flex;align-items:center;gap:2px;text-shadow:0 1px 2px #0009;white-space:nowrap}.rk-spot small svg{width:11px;height:11px;color:#ffd35a}
.rk-spot .rk-av{width:34px;height:44px;background:#ffffff26;border-radius:10px}.rk-av.empty{border:1.5px dashed #ffffff80}
.rk-entry{appearance:none;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;cursor:pointer;color:var(--ink);font:inherit;margin-top:12px}
.rk-entry>svg:first-child{color:var(--gold);width:24px;height:24px}.rk-entry b{display:block;font-size:15px}.rk-entry small{font-size:12.5px;color:var(--muted)}

.tro{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:6px 0}
.tro .ic{width:36px;height:36px;border-radius:50%;background:var(--gold-s);display:grid;place-items:center;color:var(--gold)}
.tro .ic.gray{background:var(--fill);color:var(--ink2)}
.tro b{display:block;font-size:15px}
.tro small{color:var(--muted);font-size:12px}
.tro span.n{font-weight:700;white-space:nowrap}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
td .muted{font-size:12px}
textarea{width:100%;min-height:90px;border:0;background:var(--fill);border-radius:12px;padding:10px 12px;font:13px/1.4 ui-monospace,monospace;color:var(--ink);resize:vertical}
.flag{width:84px;height:84px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line),0 6px 20px #00000014;display:grid;place-items:center;justify-self:center}
.center{text-align:center;justify-items:center}
/* identity: navy dugout, stitch red, scoreboard green */
:root{--bg:#e8ecf1;--ink:#13213a;--ink2:#4a5770;--muted:#8792a6;--line:#dde3ec;--fill:#f0f3f7;
  --blue:#17305c;--blue-d:#0f2244;--blue-s:#e5ebf6;--blue-dis:#a3b2cc;--red:#d33a3a;--down:#2f6fd0;--accent:#d33a3a;--accent-d:#b72f2f;
  --gold-s:#fff2cc;--gold:#c38506;--toast:#13213a;--scrim:#0b152a8c;
  --board:#0f2b21;--board2:#17392c;--lamp:#ffc845;--chalk:#e6f2ea;--boardtxt:#9cc3ad;
  --f-display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo',sans-serif;--f-num:'Barlow Condensed','Noto Sans KR',ui-monospace,monospace}
.ttl,.hd h1,.move .amt{font-family:var(--f-display);font-weight:400;letter-spacing:0}
body,.ttl,h1,h2,.desc,.situ,.choice,.item,.fi,.art h3{word-break:keep-all;overflow-wrap:anywhere}
.ttl b{color:var(--accent)}
.sec{border-radius:16px}
.btn{border-radius:14px}
.btn.play{background:var(--accent)} .btn.play:hover{background:var(--accent-d)}
.tabbar{background:var(--blue-d);border-radius:22px;margin-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px 4px;box-shadow:0 8px 24px #0b152a40}
.tab{color:#93a3c2;gap:3px} .tab.on{color:var(--white);font-weight:700}
.tab::after{content:"";width:4px;height:4px;border-radius:50%;background:transparent}
.tab.on::after{background:var(--lamp)}
.app.tabs{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.scoreboard{background:var(--board);color:var(--chalk);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.scoreboard .lg{font-size:12px;color:var(--lamp);font-weight:700;letter-spacing:.04em}
.scoreboard h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--lamp);line-height:1.2}
.sbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sbgrid div{background:var(--board2);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.sbgrid small{font-size:11px;color:var(--boardtxt)}
.sbgrid b{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sbgrid b span{font-size:14px;color:var(--boardtxt)}
.inn{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.inn i{height:22px;border-radius:4px;background:var(--board2);display:grid;place-items:center;font-style:normal;font-size:12px;color:#6f9b84;font-family:var(--f-num);font-weight:600}
.inn i.on{background:var(--lamp);color:var(--board)}
.tcard{border-top:6px solid var(--tc)}
.ovrbox{display:grid;justify-items:center;background:var(--fill);border-radius:12px;padding:6px 10px;min-width:60px}
.ovrbox b{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1}
.ovrbox small{font-size:10px;color:var(--muted);letter-spacing:.1em}
.ovrbox em{font-style:normal;font-size:12px;font-weight:700}
.ovrbox.max small{color:#d97706;font-weight:800}
.perf{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--fill)}
.perf .pg{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:24px;color:#fff;background:#94a3b8}
.perf b{display:block;font-size:15px}.perf small{color:var(--muted);font-size:12.5px}
.perf .pv{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--green)}
.perf.gS .pg{background:linear-gradient(135deg,#f59e0b,#ef4444)}.perf.gA .pg{background:#2563eb}.perf.gB .pg{background:#16a34a}.perf.gC .pg{background:#64748b}
.ovrbig{background:var(--board);border-radius:14px;padding:8px 16px;display:grid;justify-items:center;flex:none}
.ovrbig b{font-family:var(--f-num);font-weight:700;font-size:46px;line-height:1;color:var(--lamp)}
.ovrbig small{font-size:11px;color:var(--boardtxt);letter-spacing:.1em}
.stepnum{text-align:center;font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:.06em}
.stepnum span{color:var(--muted)}
.hold{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff40;transition:width .15s ease-out}
.hold.holding .fill{width:100%;transition:width .9s linear}
.hold .l{position:relative}
.fi{background:transparent;border-radius:0;border-left:3px solid var(--line);padding:6px 12px}
.fi::before{display:none}
.fi .gm{font-family:var(--f-num);font-weight:600;color:var(--muted);min-width:36px;font-variant-numeric:tabular-nums}
.fi.gold{background:var(--gold-s);border-color:var(--gold)} .fi.hl{background:var(--blue-s);border-color:var(--blue)} .fi.bad{border-color:var(--red)}
.move .arrow{font-size:22px;color:var(--blue);font-weight:800;text-align:center}
.cmt .pf{background:var(--blue-s);color:var(--blue)}
.site-foot{max-width:760px;margin:0 auto;padding:8px 4px 28px;display:grid;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.site-foot strong{color:var(--ink2)}
.site-foot nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.site-foot a{color:var(--ink2)}
.app.tabs{padding-bottom:16px}
.app.tabs~.site-foot{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

.donate{appearance:none;justify-self:start;display:inline-flex;align-items:center;gap:6px;background:#ffffff14;color:var(--chalk);border:1px solid #ffffff2e;border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:-4px}
.donate:hover{background:#ffffff26}
.donate svg{color:var(--lamp)}
.acct{background:var(--fill);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.acct .no{font-family:var(--f-num);font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tpv{position:fixed;inset:0;z-index:45;background:var(--board);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tpv .in{max-width:760px;margin:0 auto;display:grid;gap:16px;color:var(--chalk)}
.tpv .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tpv .when{font-size:13px;font-weight:700;color:var(--lamp);letter-spacing:.03em}
.tvf{position:relative;border-radius:16px;padding:9px;background-color:#0a1f17;background-image:radial-gradient(circle,#ffc84570 1.4px,transparent 2px);background-size:11px 11px;box-shadow:inset 0 0 0 2px #24493a}
.tvf img{display:block;width:100%;max-width:100%;aspect-ratio:96/56;border-radius:9px;image-rendering:pixelated}
.l3{position:absolute;left:22px;right:22px;bottom:22px;display:flex;align-items:stretch;flex-wrap:wrap}
.l3 .k{background:var(--accent);color:#ffffff;font-size:12px;font-weight:800;padding:0 10px;display:grid;place-items:center;letter-spacing:.04em}
.l3 b{background:var(--lamp);color:var(--board);font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.3;padding:4px 14px;min-width:0;overflow-wrap:anywhere}
.tpres{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 18px;display:grid;gap:12px;justify-items:center;text-align:center}
.tpres .stamp{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--accent);border:4px solid var(--accent);border-radius:12px;padding:6px 18px 4px;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
.effs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.eff{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--fill);color:var(--ink2)}
.eff.g{background:#e9f8ef;color:#0f7a43} .eff.b{background:#fdf0f0;color:#b72f2f}
@media (max-width:480px){.l3{left:16px;right:16px;bottom:16px}.l3 b{font-size:18px}}
.tpres .stamp.gold{color:var(--gold);border-color:var(--gold)}
.tpv.award{background:#150d24}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.tpv.award .in{position:relative;z-index:1}
.shelf{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;max-width:520px}
.shelf .tr{display:grid;justify-items:center;gap:2px;color:var(--gold)}
.shelf .tr svg{width:22px;height:22px}
.shelf .tr small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf .tr.now svg{width:28px;height:28px;filter:drop-shadow(0 0 6px #f5c54299)}
.mvpb{display:inline-block;font-size:11px;font-weight:800;color:#7a5200;background:var(--gold-s);border:1px solid #f0d58a;padding:1px 7px;border-radius:6px;vertical-align:middle;margin-left:4px}
.vote{display:grid;gap:6px;width:100%;text-align:left}
.vrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--fill);font-size:14px}
.vrow .vr{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.vrow .vl{min-width:0;overflow-wrap:anywhere}
.vrow .vp{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.vrow.me{background:var(--gold-s);box-shadow:inset 0 0 0 2px #f0d58a;font-weight:700}
.vrow.me .vr{color:var(--gold)}
.momres{border-radius:18px;padding:22px 18px;display:grid;gap:8px;text-align:center;justify-items:center}
.momres.ok{background:#e9f8ef;border:2px solid var(--green)}
.momres.no{background:#fdf0f0;border:2px solid var(--red)}
.momres .big{font-family:var(--f-display);font-size:52px;line-height:1;animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
.momres.ok .big{color:var(--green)} .momres.no .big{color:var(--red)}
.momres .eff{margin:0;font-size:13px;font-weight:700;color:var(--ink2)}
/* 비시즌 메시지 */
.dm{position:fixed;inset:0;z-index:45;background:#0b152acc;display:flex;justify-content:center;align-items:stretch}
.dm .ph{width:100%;max-width:560px;background:#e6ebf2;display:grid;grid-template-rows:auto 1fr auto;min-height:0;height:100%}
@media (min-width:600px){.dm{align-items:center;padding:24px}.dm .ph{height:min(820px,100%);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px #0008}}
.dm .bar{background:var(--blue-d);color:#ffffff;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 14px 10px 6px}
.dm .bar .icbtn{color:#ffffff}
.dm .pf{width:40px;height:40px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;overflow:hidden;flex:none}
.dm .pf img{width:30px;height:38px;image-rendering:pixelated;margin-top:12px}
.dm .pf.sm{width:34px;height:34px;background:#cfd8e5}
.dm .pf.sm img{width:26px;height:33px;margin-top:10px}
.dm .nm{display:grid;min-width:0}.dm .nm b{font-size:16px;overflow-wrap:anywhere}.dm .nm small{font-size:12px;color:#a9b8d6}
.dm .log{overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:6px;min-height:0}
.dm .day{align-self:center;font-size:12px;color:#55637c;background:#d4dbe6;padding:3px 12px;border-radius:999px;margin:2px 0 10px}
.msgrow{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.msgrow .col{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.bub{max-width:100%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;animation:bubin .32s ease both}
.bub.in{background:#ffffff;color:var(--ink);border-top-left-radius:6px}
.bub.out{align-self:flex-end;max-width:80%;background:var(--accent);color:#ffffff;border-top-right-radius:6px;margin-top:8px}
.bub.late{animation-delay:1.2s}
.dm .tm{font-size:11px;color:#7b879b;margin:0 0 2px 46px}
.typing{align-self:flex-start;margin-left:42px;background:#ffffff;border-radius:18px;display:flex;gap:4px;overflow:hidden;animation:tdots 1.2s ease both .25s}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa6ba;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdots{0%{opacity:0;max-height:0;padding:0 14px}15%,80%{opacity:1;max-height:40px;padding:12px 14px}100%{opacity:0;max-height:0;padding:0 14px;margin-top:-6px}}
@keyframes blink{50%{opacity:.3}}
@keyframes bubin{from{opacity:0;transform:translateY(6px)}}
.sys{align-self:center;background:#ffffff;border-radius:16px;padding:12px 14px;display:grid;gap:8px;justify-items:center;text-align:center;max-width:94%;margin-top:10px;animation:bubin .32s ease both 1.7s}
.sys b{font-size:13px;color:var(--ink2)} .sys p{margin:0;font-size:12px;color:var(--muted)}
.dm .tray{background:#ffffff;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;border-top:1px solid #d8dfe9}
.dm .tray .lb{font-size:12px;color:var(--muted);font-weight:700}
.rep{appearance:none;border:1.5px solid #e2a3a3;background:#ffffff;color:var(--ink);border-radius:18px 18px 6px 18px;padding:10px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;width:100%}
.rep b{font-size:15px;color:var(--accent-d);line-height:1.45}.rep small{font-size:12px;color:var(--ink2)}
.rep:hover{background:#fdf2f2;border-color:var(--accent)}
.dm .later{appearance:none;background:transparent;border:0;color:var(--muted);text-decoration:underline;font-size:13px;justify-self:center;cursor:pointer;padding:6px}
/* 승부처 상황판 */
.sit{background:var(--board);color:var(--chalk);border-radius:18px;padding:14px 16px;display:grid;gap:12px}
.sit .st{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;justify-content:space-between}
.sit .inn2{font-family:var(--f-display);font-size:20px;color:var(--lamp);line-height:1}
.sit .sc{display:flex;align-items:baseline;gap:7px;font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.sit .sc span{font-family:var(--f-body);font-size:13px;color:var(--boardtxt);font-weight:700}
.sit .sc em{font-style:normal;color:var(--boardtxt)}
.bso{display:grid;grid-template-columns:auto auto;gap:3px 6px;align-items:center;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--boardtxt)}
.bso>span:not(.l){display:flex;gap:3px}
.bso i{display:block;width:9px;height:9px;border-radius:50%;background:#24493a}
.bso .b i.on{background:#4ade80}.bso .s i.on{background:var(--lamp)}.bso .o i.on{background:#f87171}
.sit .bd{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.dia{width:72px;height:72px;flex:none}
.dia .bs{fill:#24493a;stroke:#3d6b57;stroke-width:1.5}.dia .bs.on{fill:var(--lamp);stroke:var(--lamp)}.dia .hp{fill:#e6f2ea}
.sit .k{font-size:12px;font-weight:800;color:var(--lamp);letter-spacing:.03em;margin:0}

function shortT(n){

  if(/고등학교$/.test(n))return n.replace('고등학교','고');
  if(/대학교$/.test(n))return n.replace('대학교','대');
  if(TEAMS.US.some(t=>t[0]===n))return n.split(' ').slice(-1)[0];
  const JPS={'요코하마 DeNA 베이스타스':'요코하마','도쿄 야쿠르트 스왈로스':'야쿠르트','후쿠오카 소프트뱅크 호크스':'소프트뱅크','지바 롯데 마린스':'지바 롯데','도호쿠 라쿠텐 골든이글스':'라쿠텐','사이타마 세이부 라이온스':'세이부','홋카이도 닛폰햄 파이터스':'닛폰햄','히로시마 도요 카프':'히로시마'};

}

function pickTP(){
  if(R()>.85)return null;

  if(!el.length)return null;

}
const tpDef=id=>TP.find(t=>t.id===id);
const tpTitle=d=>d?WHO[d.who].n()+'의 메시지':'';
function chooseTP(i){

function natEvent(){
  if(S.org==='HS'&&S.grade>=2)return'U-18 야구 월드컵';

function checkNat(){

function offerOf(kind,org,team,o={}){
  const r=o.role?{role:o.role,comp:compFor(org,team)}:roleFor(org,team);
  const fa=kind==='fa'||kind==='posting'||kind==='overseas';
  const sal=o.sal??salary(org,r.role,ovr(),fa);
  const a=S.age, noYears=['draft','ikseong','trade','return'].includes(kind);
  const years=noYears?null:org==='KR'?(a<=30?4:a<=33?2:1):org==='US'?(a<=29?ri(3,5):ri(1,3)):(a<=30?ri(2,3):1);
  const fee=kind==='posting'?r1(sal*(years||1)*.2):0;
  return{kind,org,team,role:r.role,comp:r.comp,sal,years,fee,bonus:o.bonus||0,label:o.label||team,round:o.round,contract:true};
}

function simChunk(eff,f){

  const ra=late?(a<=20?.12:a<=24?.21:a<=28?.16:a<=31?.05:0):(a<=19?.2:a<=22?.22:a<=25?.16:a<=28?.08:a<=30?.03:0);

function totals(){

  if(isP()){const t={G:0,W:0,L:0,IP:0,ER:0,K:0,SV:0,HLD:0,war:0};rows.forEach(h=>{const l=h.line;if(l.t!=='P')return;['G','W','L','IP','ER','K','SV','HLD'].forEach(k=>t[k]+=l[k]||0);t.war+=h.war});t.era=t.IP?t.ER*9/t.IP:0;t.war=r1(t.war);return t}
  const t={G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,war:0};rows.forEach(h=>{const l=h.line;if(l.t!=='B')return;['G','PA','AB','H','HR','RBI','SB'].forEach(k=>t[k]+=l[k]||0);t.war+=h.war});t.avg=t.AB?t.H/t.AB:0;t.war=r1(t.war);return t;

function migrate(s){
  if(!s||s.real)return s;
  const OLD={KR:['서울 타이탄스','인천 시걸스','수원 스톰','대전 블루윙스','광주 피닉스','대구 레드혼스','부산 하버스','창원 아이언스','고양 썬더스','청주 스타즈'],JP:['도쿄 레이븐스','오사카 썬즈','후쿠오카 웨이브스','삿포로 폴라스','나고야 드래곤플라이','요코하마 스타피시'],US:['뉴욕 해머스','LA 코메츠','시카고 랜턴스','보스턴 파이크스','시애틀 파인스','휴스턴 로켓맨','애틀랜타 피치스','샌프란시스코 포그혼스'],UNIV:['한빛대학교','청운대학교','동명대학교','해솔대학교']};
  let j=JSON.stringify(s);
  for(const org in OLD)OLD[org].forEach((n,i)=>{j=j.split(n).join(TEAMS[org][i][0])});
  j=j.split('"상무"').join('"상무 피닉스"');
  j=j.replace(/(코리아 리그|일본 리그|빅리그) (MVP|신인왕|[가-힣]+왕)/g,(m,a,b)=>({'코리아 리그':'KBO','일본 리그':'NPB','빅리그':'MLB'}[a])+' '+b);
  [['빅리그 챔피언십 우승','월드시리즈 우승'],['코리아 시리즈 우승','한국시리즈 우승'],['일본 시리즈 우승','일본시리즈 우승'],['전국 고교 야구 대회 우승','황금사자기 우승'],['대학 야구 리그 우승','대학야구 U-리그 우승'],
   ['2군 리그 MVP','퓨처스리그 MVP'],['2군 리그 우승','퓨처스리그 우승'],['올스타 퍼스트 팀','MLB 올스타'],['"베스트 나인"','"NPB 베스트 나인"'],['월드 클래식','WBC'],['프리미어 대회','프리미어12'],['U-18 세계 청소년 선수권','U-18 야구 월드컵'],
   ['코리아 리그','KBO 리그'],['일본 리그','NPB'],['빅리그','MLB'],['2군 리그','KBO 퓨처스리그']].forEach(([a,b])=>{j=j.split(a).join(b)});
  const o=JSON.parse(j);o.real=1;return o;
}
function fixState(){

  }else if(s===0){
    body=`<div><p class="eyebrow">나의 야구 인생 · 고1, 16세 봄</p><h1 class="ttl">어떤 선수로<br>뛰어 볼까요?</h1></div>
    <div class="f2"><div class="field"><label for="c-name">이름</label><input id="c-name" maxlength="10" placeholder="닉네임을 추천해요" value="${esc(C.name)}" autocomplete="off"></div>
    <div class="field"><label for="c-num">등번호</label><input id="c-num" type="number" min="0" max="99" value="${esc(C.num)}" placeholder="0~99"></div></div>
    <div class="sec" style="padding:4px 16px;gap:0;background:var(--fill)">
      <div class="opt-row"><span>포지션</span><select id="c-pos" aria-label="포지션">${POSORDER.map(p=>`<option value="${p}" ${C.pos===p?'selected':''}>${p} ${SUBPOS[p].n}</option>`).join('')}</select></div>
      <div class="opt-row"><span>투타</span><div class="seg">${['우투우타','우투좌타','좌투좌타'].map(h=>`<button class="${C.hand===h?'on':''}" data-a="c-hand" data-v="${h}">${h}</button>`).join('')}</div></div>
      <div class="opt-row"><span>국적</span><b style="font-size:15px">대한민국</b></div>
      <div class="opt-row"><span>고등학교</span><select id="c-school" aria-label="고등학교">${TEAMS.HS.map(([n,,r],i)=>`<option value="${i}" ${C.school===i?'selected':''}>${n} · ${r}</option>`).join('')}</select></div>
    </div>
    <p class="desc" style="font-size:12px">학교, 구단, 리그, 대회는 실제 이름을 빌려 왔어요. 공식 제휴가 아니고, 경기 결과와 기록, 계약은 모두 가상이에요.</p>`;
    btn=`<button class="btn" data-a="c-next">다음</button>`;
  }else if(s===2){
    if(!C.cands)C.cands=makeCands(C.pos);
    const keys=keysOf(C.pos), w=SUBPOS[C.pos].w;
    body=`<div><p class="eyebrow">${esc(C.name||'이름 없는 신인')} · ${SUBPOS[C.pos].n}</p><h1 class="ttl">${SUBPOS[C.pos].g==='P'?'투구':'타격'} 스타일을<br>정해 주세요</h1><p class="desc" style="margin-top:6px">세 후보 모두 종합 능력치는 45예요. 능력치 분포만 다르고, 잠재력은 숨겨져 있어요.</p></div>
    ${C.cands.map((c,i)=>{const top2=keys.slice().sort((a,b)=>c.stats[b]-c.stats[a]).slice(0,2);
      return`<button class="stycard ${C.pick===i?'on':''}" data-a="c-pick" data-v="${i}"><div class="t"><span><b>${c.style}</b><br><span class="muted" style="font-size:13px">${c.desc}</span></span><span class="check">${C.pick===i?ICON.check:''}</span></div>
      <div class="tags">${top2.map(k=>`<span class="tag">${SN[k]} ${c.stats[k]}</span>`).join('')}</div>
      ${C.pick===i?`<div class="bars">${keys.map(k=>`<div class="bar ${w[k]>=.2?'focus':''}"><span>${SN[k]}</span><span class="tr"><i style="width:${c.stats[k]}%"></i></span><span>${c.stats[k]}</span></div>`).join('')}</div>`:''}</button>`}).join('')}
    <button class="btn gray sm" data-a="c-reroll">후보 다시 뽑기</button>`;
    btn=`<button class="btn" data-a="c-next">이 스타일로 갈게요</button>`;
  }else{
    const c=C.cands[C.pick], keys=keysOf(C.pos);
    body=`<div><p class="eyebrow">${c.style} ${SUBPOS[C.pos].n} · OVR 45</p><h1 class="ttl">어디에 땀을<br>쏟아 볼까요?</h1><p class="desc" style="margin-top:6px">훈련 포커스를 2개까지 고를 수 있어요. 고른 능력치가 훨씬 빨리 자라고, 선택의 순간에 바뀔 수도 있어요.</p></div>
    <div>${keys.map(k=>`<button class="pickrow" data-a="c-focus" data-v="${k}"><span>${SN[k]}${SUBPOS[C.pos].w[k]>=.2?' <span class="badge gray">포지션 핵심</span>':''}</span><span class="v">${c.stats[k]}<span class="check ${C.focus.includes(k)?'on':''}">${C.focus.includes(k)?ICON.check:''}</span></span></button>`).join('')}</div>`;
    btn=`<button class="btn" data-a="c-make" ${C.focus.length?'':'disabled'}>스카우팅 리포트 보기</button>`;
  }
  let ov='';
  if(C.confirm){const c=C.cands[C.pick];
    ov=`<div class="ov" data-a="c-noconfirm"><div class="sheet" role="dialog" aria-label="스카우팅 리포트"><button class="icbtn x" data-a="c-noconfirm" aria-label="닫기">${ICON.close}</button><p class="eyebrow" style="font-weight:700;color:var(--accent)">스카우팅 리포트</p>
    <div class="pcard"><div class="ava">${avaImg(AVS[C.avatar],sch)}</div><div><div style="font-size:20px;font-weight:800">${esc(C.name||'이름 없는 신인')} <span class="badge">${SUBPOS[C.pos].n}</span></div><div class="muted" style="font-size:13px">${c.style} · 등번호 ${parseInt(C.num)>=0&&C.num!==''?clamp(parseInt(C.num),0,99):'자동'} · 16세</div></div></div>
    <div class="rows"><div class="row"><span>소속</span><span>${emblem(sch,20)} ${sch}</span></div><div class="row"><span>국적 · 투타</span><span>대한민국 · ${C.hand}</span></div><div class="row"><span>능력치 합 · OVR</span><span>${Object.values(c.stats).reduce((a,b)=>a+b,0)} · 45</span></div><div class="row"><span>훈련 포커스</span><span>${C.focus.map(k=>SN[k]).join(', ')}</span></div><div class="row"><span>잠재력</span><span>스카우트도 아직 몰라요</span></div></div>
    <div class="btns"><button class="btn gray" data-a="c-noconfirm">다시 고르기</button><button class="btn play" data-a="c-start">입학하기</button></div></div></div>`}
  return`<div class="page">${nav}<div class="stack">${body}</div><div></div>${btn}</div>${ov}${s===0?rankEntry():''}${hofMini()}`;
}
function hofMini(){const l=loadHof().slice(0,5);if(!l.length||C.step)return'';return`<section class="sec"><h2>명예의 전당 <span>이 기기</span></h2>${hofTable(l)}</section>`}
function hofTable(l){return l.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>선수</th><th class="r">MVP</th><th class="r">WBSC</th><th class="r">최고</th><th class="r">개인상</th><th class="r">WAR</th></tr></thead><tbody>${l.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h.name)} <span class="muted">${esc(h.pos)}</span></td><td class="r">${h.mvp}</td><td class="r">${h.wb||0}</td><td class="r">${h.maxOvr}</td><td class="r">${h.aw}</td><td class="r">${h.war}</td></tr>`).join('')}</tbody></table></div>`:'<p class="desc">아직 은퇴한 선수가 없어요.</p>'}

/* ================= render: app tabs ================= */

    ${S.nat&&S.nat.joined?`<div class="row"><span>대표팀</span><span>${S.year} ${S.nat.ev} 합류</span></div>`:''}`;

function tabSeason(){
  const L=S.last, off=S.off;let h=head('시즌');
  if(L){const l=derive(L.line);
    h+=`<section class="sec"><p class="eyebrow">${L.y} 시즌 · ${esc(L.team)}${L.role==='minor'?' 2군':''}</p>
    <div class="ttl" style="font-size:22px;margin-top:-8px">${!l.G?'출전 기록이 없어요':l.t==='B'?`타율 ${avg3(l.avg)} · ${l.HR}홈런`:`${l.W}승 ${l.L}패 · 평균자책점 ${l.era.toFixed(2)}`}</div>
    <div class="delta ${L.oa-L.ob>0?'up':'muted'}" style="margin-top:-10px">${L.oa-L.ob?`종합 능력치 ${sgn(L.oa-L.ob)}`:'종합 능력치 변화 없음'}</div>
    <div class="trio">${(l.t==='B'?[['출전',l.G+'경기'],['타점',l.RBI],['WAR',l.war.toFixed(1)]]:[['출전',l.G+'경기'],['탈삼진',l.K],['WAR',l.war.toFixed(1)]]).map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div></section>`;}
  if(off){
    h+=`<section class="sec"><p class="eyebrow">오프시즌</p><div class="ttl" style="margin-top:-8px">${off.title}</div>${off.desc?`<p class="desc">${esc(off.desc)}</p>`:''}
    ${off.rows.length?`<div class="rows">${off.rows.map(([a,b])=>`<div class="row"><span>${a}</span><span>${esc(b)}</span></div>`).join('')}</div>`:''}</section>`;
    if(off.decided)h+=`<section class="sec"><h2>결정 완료</h2><div class="list"><div class="item" style="cursor:default"><span class="ic blue">${ICON.check}</span><span><b>${esc(off.decided)}</b><small>${S.year} 시즌부터 적용돼요</small></span><span></span></div></div></section>`;
    else{
      h+=`<section class="sec"><h2>${off.offers.some(x=>x.contract)?'협상 테이블':'선택지'} <span>${off.offers.length}개</span></h2><div class="list">${off.offers.map(x=>`<button class="item" data-a="offer" data-v="${x.id}"><span class="ic">${x.contract?emblem(x.team,28):ICON.flag}</span><span><b>${esc(x.label)}</b><small>${esc(x.sub||'')}</small></span><span class="chev">${ICON.chev}</span></button>`).join('')}</div></section>`;
      if(off.req)h+=`<section class="sec"><h2>직접 트레이드 요청</h2><p class="desc">요청이 받아들여지면 다른 구단의 트레이드 제안이 도착해요. 요청하면 사기가 조금 떨어지고, 한 겨울에 한 번만 할 수 있어요.</p><button class="btn gray sm" data-a="reqtrade">트레이드 요청하기</button></section>`;
    }
  }
  if(S.tp&&!S.tp.done)h+=`<section class="sec"><p class="eyebrow">새 메시지</p><div style="font-size:17px;font-weight:800;margin-top:-8px">${esc(tpTitle(tpDef(S.tp.id)))}</div><button class="btn sm" data-a="tp">메시지 열기</button></section>`;
  if(S.nat&&S.nat.joined==null)h+=`<section class="sec"><p class="eyebrow">태극마크</p><div style="font-size:17px;font-weight:800;margin-top:-8px">${S.year} ${esc(S.nat.ev)} 최종 엔트리</div><button class="btn sm" data-a="nat">합류 여부 정하기</button></section>`;
  h+=`<section class="sec"><h2>${S.year} 시즌</h2><div class="rows">${seasonInfoRows()}</div></section>`;
  return h;
}
function tabPlayer(){

  <div class="trio"><div><small>종합 능력치</small><b>${ovr()}</b></div><div><small>훈련 포커스</small><b style="font-size:15px">${S.focus.map(k=>SN[k]).join(', ')}</b></div><div><small>잠재력</small><b>???</b></div></div></section>
  <section class="sec"><h2>능력치 <span>남색 막대는 훈련 포커스</span></h2><div class="bars">${keys.map(k=>{const v=Math.floor(S.stats[k]),d=prev[k]!=null?v-Math.floor(prev[k]):0;

  <section class="sec"><h2>상태</h2><div class="rows">

    <div class="row"><span>명성</span><span>${Math.round(S.fame)}</span></div>

    <div class="row"><span>누적 수입</span><span>${money(r1(S.earn))}</span></div>
  </div></section>`;
}
function tabRecord(){
  const t=S.tro.filter(x=>x.k==='t'||x.k==='m'), a=S.tro.filter(x=>x.k==='a');
  let h=`${head('기록실')}<section class="sec"><div class="ttl" style="margin:0">우승 ${trophyCount()}회 · 개인상 ${awardCount()}회</div>${S.mvp||S.wbsc?`<p class="desc"><b class="blue">${[S.mvp?`MVP ${S.mvp}회`:'',S.wbsc?`${WBSC_AW} ${S.wbsc}회`:''].filter(Boolean).join(' · ')}</b></p>`:''}</section>
  <section class="sec"><div class="seg" style="display:grid;grid-template-columns:repeat(3,1fr)">${[['tro','우승 '+t.length],['aw','개인상 '+a.length],['season','시즌별']].map(([k,l])=>`<button class="${ui.recTab===k?'on':''}" data-a="rec-tab" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(ui.recTab==='season'){
    const rows=S.hist.slice().reverse();
    h+=rows.length?`<div class="tablewrap"><table><thead><tr><th>연도</th><th>소속 · 성적</th><th class="r">WAR</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.y}<br><span class="muted">${r.age}세</span></td><td>${esc(r.team)} <span class="muted">${esc(r.lg)} · ${esc(r.role)}</span><br>${lineTxt(r.line)}${r.aw.length?`<br><span style="color:var(--gold);font-weight:700;font-size:12px">${r.aw.map(esc).join(', ')}</span>`:''}</td><td class="r">${(+r.war).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="desc">첫 시즌이 끝나면 기록이 쌓여요.</p>';
  }else{
    const src=ui.recTab==='tro'?t:a, cats=[['all','전체'],['am','아마추어'],['pro','프로'],['nat','국가대표']];
    const f=src.filter(x=>ui.recCat==='all'||x.cat===ui.recCat);
    const g={};f.forEach(x=>{const key=x.n.replace(/^\d{4} /,'');(g[key]=g[key]||[]).push(x.y)});
    h+=`<div class="chips">${cats.map(([k,l])=>`<button class="chip ${ui.recCat===k?'on':''}" data-a="rec-cat" data-v="${k}">${l} ${src.filter(x=>k==='all'||x.cat===k).length}</button>`).join('')}</div>`;
    h+=Object.keys(g).length?Object.entries(g).map(([n,ys])=>`<div class="tro"><span class="ic">${ui.recTab==='tro'?ICON.trophy:ICON.medal}</span><span><b>${esc(n)}</b><small>${ys.join(', ')}</small></span><span class="n">${ys.length}회</span></div>`).join(''):`<p class="desc">${ui.recTab==='tro'?'아직 우승 기록이 없어요.':'아직 개인상 기록이 없어요.'}</p>`;
  }
  h+=`</section>${rankEntry()}<section class="sec"><h2>명예의 전당 <span>이 기기</span></h2>${hofTable(loadHof().slice(0,10))}</section>`;
  return h;
}
function renderApp(){
  const tabs=[['home','라커룸'],['news','뉴스'],['season','시즌'],['player','선수 카드'],['record','기록실']];
  const body={home:tabHome,news:tabNews,season:tabSeason,player:tabPlayer,record:tabRecord}[ui.tab]();

function renderProgress(){

  const l=liveLine(P), gp=Math.round(p*P.totalG), W=Math.round(gp*(P.wp||.5));

  if(e&&e.t==='mom'&&!e.done){main=momCard(e);ttl='승부처가 찾아왔어요';btn=`<button class="btn gray" data-a="mom-skip">이번 승부는 넘어가기</button>`}

  else btn=`<button class="btn gray" data-a="skip-next">${P.ev.some(x=>!x.done)||!P.segs[2]?'다음 선택지로 건너뛰기':'시즌 결과 보기'}</button>`;

function liveLine(P){

function tick(){
  const P=S&&S.prog;if(!P||S.phase!=='progress'){clearInterval(timer);timer=null;return}
  ensureSegs(P);
  let e=evPending(P);
  while(e&&!e.done&&e.t==='mom'&&!momReady(P,e))e=evPending(P);
  if(e)return;
  const nx=P.ev.filter(x=>!x.done&&x.p>P.p+1e-9).map(x=>x.p).sort((a,b)=>a-b)[0];
  P.p=Math.min(1,P.p+.0105);
  if(nx!=null&&P.p>=nx){P.p=nx;ensureSegs(P);const q=evPending(P);if(q&&q.t==='mom')momReady(P,q);save();render();return}

}

    if(an.k==='wind'&&now-an.t0>=an.dur){PG.an={k:'fly',t0:now,dur:G.cur.ms};P3.trailN=0;SND.whoosh();
      const ob=G.pa.on, res=pgResolvePit(G);PG.pre={res,ob};PG.swAt=0;PG.aiSw=G.aiSwing?now+G.cur.ms-150:0}
    else if(an.k==='fly'&&now>=an.t0+an.dur+120){const pr=PG.pre;PG.pre=null;if(pr)p3Post(G,pr.res,now,pr.ob)}
  }
}
function p3Loop(ts){
  PG.raf=0;
  const G=S&&S.play, host=document.getElementById('pg3c');
  if(!G||S.phase!=='play'||!host||!P3.r)return;
  const dt=Math.min(.05,(ts-(P3.last||ts))/1000);P3.last=ts;
  const w=host.clientWidth,h=host.clientHeight;
  if(w&&h&&(w!==P3.w||h!==P3.h)){P3.w=w;P3.h=h;P3.r.setPixelRatio(Math.min(window.devicePixelRatio||1,w<700?1.75:2));P3.r.setSize(w,h,false);P3.cam.aspect=w/h;P3.cam.updateProjectionMatrix()}
  pgStep(G,ts);p3Frame(G,ts,dt);if(!PG.pre&&!PG.rv)p3Board(G);
  if(PG.charge&&G.mode==='pit'){const pw=pgPow(ts),el=document.getElementById('pg-pwr'),lb=document.getElementById('pg-pwrv');if(el)el.style.width=(pw*100)+'%';if(lb)lb.textContent=`${Math.round(pgVk(G,G.sel.type,pw))}km${pw>.95?' · 전력투구':pw<.35?' · 살살':''}`}
  P3.r.render(P3.sc,P3.cam);
  PG.raf=requestAnimationFrame(p3Loop);
}
function pgInit(){
  const host=document.getElementById('pg3c');if(!host)return;
  host.innerHTML='<div class="p3load">3D 경기장을 불러오는 중…</div>';
  load3D(ok=>{
    const h=document.getElementById('pg3c');if(!h||!S||!S.play)return;
    if(ok&&!P3.r){try{const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
      P3.r=r;P3.sc=new THREE.Scene();P3.cam=new THREE.PerspectiveCamera(30,1,.05,900);p3BuildStadium();p3BuildActors();
      r.domElement.addEventListener('pointerdown',p3Down);r.domElement.addEventListener('pointermove',p3Move);r.domElement.addEventListener('contextmenu',e=>e.preventDefault())}catch(e){P3.r=null;ok=false}}
    if(!ok||!P3.r){h.innerHTML='<div class="p3load">이 기기에서는 3D 화면을 불러오지 못했어요.<br>위의 <b>자동 진행</b>으로 경기를 마칠 수 있어요.</div>';P3.fail=true;pgHud();return}
    h.innerHTML='';h.appendChild(P3.r.domElement);P3.w=0;P3.last=0;P3.dressed=null;P3.board='';P3.bb=null;P3.view='';
    const G=S.play;PG.an=null;PG.rv=null;PG.sw=null;PG.swAt=0;PG.hover=null;p3ResetField(G);
    if(G.mode==='bat'&&G.st==='pitching')PG.next=performance.now()+900;
    if(G.mode==='pit'&&G.st==='anim'){if(G.cur)PG.an={k:'wind',t0:performance.now(),dur:760};else G.st='aim'}
    if(G.mode==='pit'&&G.st==='meter')G.st='aim';PG.charge=0;
    pgHud();if(!PG.raf)PG.raf=requestAnimationFrame(p3Loop);
  });
}
/* ---- 화면 위 정보 ---- */
function pgShell(){const G=S.play;return`<div class="pg3" id="pg3" role="dialog" aria-label="${esc(G.label)} 직접 플레이">
  <div id="pg3c" class="pg3c" aria-label="3D 경기 화면"></div>
  <div class="p3top"><div id="p3bug" class="p3bug"></div><div class="p3act"><span class="when">${esc(G.label)}</span><div class="p3btns" id="p3btns"></div></div></div>
  <div id="pg-fl" class="p3fl" aria-live="polite"><b></b><small></small></div>
  <div id="pg-ctl" class="p3btm"></div></div>`}
function pgLineHTML(G){
  const n=Math.max(9,G.a.length,G.h.length), curA=!G.done&&G.top?G.inn-1:-1, curH=!G.done&&!G.top?G.inn-1:-1;
  const row=(cd,arr,cur,tot)=>`<tr><td class="t"><i style="background:${cd[1]}"></i>${esc(cd[0])}</td>${[...Array(n)].map((_,i)=>`<td class="${i===cur?'cur':''}">${arr[i]==null?'':arr[i]}</td>`).join('')}<td class="r">${tot}</td></tr>`;
  return`<div class="lsc-w"><table class="lsc"><thead><tr><th></th>${[...Array(n)].map((_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr></thead><tbody>${row(G.oc,G.a,curA,G.op)}${row(G.mc,G.h,curH,G.my)}</tbody></table></div>`;
}
function pgBugHTML(G){
  const pa=G.pa, me=pgMs(G);
  const who=G.mode==='bat'?(G.pit?`<b>${esc(G.pit.lab)}</b> · 최고 ${G.pit.v}km<br>타석 ${esc(S.name)} · ${msLine(me)||'오늘 첫 타석'}`:'')
    :`<b>${esc(G.lu[G.bi].lab)}</b><br>마운드 ${G.role==='pit'?esc(S.name)+' · '+msLine(me):esc(G.me)+' 마무리 (직접 조종)'}`;
  return`<div class="bugm"><div class="tms"><div><i style="background:${G.oc[1]}"></i>${esc(G.oc[0])}<b>${G.op}</b></div><div><i style="background:${G.mc[1]}"></i>${esc(G.mc[0])}<b>${G.my}</b></div></div>
    <div class="st"><span class="p3inn">${G.top?'▲':'▼'}${G.inn}</span>${diaHTML(pa?pa.on:'')}${bsoHTML(pa?pa.b:0,pa?pa.s:0,pa?Math.min(2,pa.out):0)}</div></div><div class="who">${who}</div>`;
}
function pgCtlHTML(G){
  const busy=PG.an&&(PG.an.k==='post'||PG.an.k==='bb');
  if(P3.fail&&G.st!=='over')return`<div class="p3card"><p>${esc(G.intro||G.msg||'')}</p><button class="btn play" data-a="pg-auto">자동 진행으로 경기 마치기</button></div>`;
  if(G.st==='over'){
    if(busy)return'';
    const N=S.prog&&S.prog.nat, med=G.kind==='nat'&&N?N.medals:null, head=G.win?(med?med[0]:'우승'):(med?med[1]:'준우승');
    return`<div class="p3card over ${G.win?'w':'l'}"><div class="stampx">${esc(head)}${G.win?'!':''}</div><div class="fs">${esc(G.me)} ${G.my} : ${G.op} ${esc(G.opp)}</div>${pgLineHTML(G)}<p>${esc(msLine(pgMs(G))||'출전 기록 없음')}</p><button class="btn play" data-a="pg-done">결과 확인</button></div>`;
  }
  if(busy&&G.st!=='pitching'&&G.st!=='aim')return'';
  if(G.st==='intro')return`<div class="p3card"><span class="k">${G.mode==='bat'?'타석':'마운드'} · ${G.inn}회${G.top?'초':'말'}</span><p>${esc(G.intro||'')}</p><button class="btn play" data-a="pg-start">${G.mode==='bat'?'타석에 들어서기':'마운드에 오르기'}</button></div>`;
  if(G.st==='between')return`<div class="p3card"><p>${esc(G.msg)}</p>${pgLineHTML(G)}<button class="btn" data-a="pg-next">다음</button></div>`;
  if(G.mode==='bat'){const pw=Math.round(P3.bpow*100);
    return`<p class="p3hint">${P3.assist?'공이 홈플레이트에 닿는 순간 화면을 누르세요.':'공이 지나갈 자리를, 공이 도착하는 순간 누르세요. 화면 어디든 노릴 수 있어요.'} 볼은 그냥 보내요.</p>
    <div class="spow"><span>짧게</span><input type="range" id="p3pow" min="0" max="100" value="${pw}" aria-label="스윙 세기"><span>세게</span><b id="p3powv">${powLab(P3.bpow)}</b></div>
    <button class="btn play pg-big" data-pg="swing">스윙</button>`}
  const types=`<div class="pg-types" role="group" aria-label="구종">${G.ars.map(t=>`<button class="${G.sel.type===t?'on':''}" data-a="pg-type" data-v="${t}" ${G.st==='anim'?'disabled':''}>${t}<small>최고 ${Math.round(pgVk(G,t,1))}km</small></button>`).join('')}</div>`;
  const map=`<div class="amap" id="p3map" role="img" aria-label="던질 곳 조준판. 누르거나 끌어서 위치를 정해요">${pgMapSVG(G)}</div>`;
  const right=G.st==='anim'?`<button class="btn play pg-big" disabled>투구 중</button>`
    :`<div class="pwr" aria-hidden="true"><i id="pg-pwr"></i><b id="pg-pwrv">꾹 누르면 힘이 차요</b></div><button class="btn play pg-big" data-pg="throw">꾹 눌러 던지기</button>`;
  return`<div class="pitw">${types}<div class="pitr">${map}<div class="pitc">${right}</div></div><p class="p3hint">조준판 어디든 눌러 고르고, 버튼을 꾹 눌렀다 떼서 던져요. 세게 던질수록 빠르지만 제구가 흔들리고, 타자 몸에 맞으면 데드볼이에요.</p></div>`;
}
const powLab=p=>p<.34?'맞히기':p<.67?'보통':'풀스윙';
function pgHud(){
  const G=S&&S.play;if(!G||!HAS_DOM)return;
  const b=document.getElementById('p3bug'),c=document.getElementById('pg-ctl'),t=document.getElementById('p3btns');
  if(PG.rv){if(c)c.innerHTML='<p class="p3hint" style="text-align:center;font-size:14px">타구를 끝까지 지켜보세요…</p>'}
  else{if(b)b.innerHTML=pgBugHTML(G);if(c)c.innerHTML=pgCtlHTML(G)}
  if(t)t.innerHTML=`<button class="${P3.snd?'on':''}" data-a="pg-snd" aria-pressed="${P3.snd}">소리</button>${G.mode==='bat'?`<button class="${P3.assist?'on':''}" data-a="pg-assist" aria-pressed="${P3.assist}">조준 보조</button>`:''}${G.done?'':'<button data-a="pg-auto">자동 진행</button>'}`;
}
function pgFlash(t,cls,sub){const el=document.getElementById('pg-fl');if(!el)return;el.className='p3fl';void el.offsetWidth;el.querySelector('b').textContent=t;el.querySelector('small').textContent=sub||'';el.className='p3fl on '+(cls||'')}

/* ================= hold to stamp ================= */
function initHold(){
  const b=document.getElementById('holdbtn');if(!b||b._init)return;b._init=1;let t=null;
  const start=e=>{e.preventDefault();b.classList.add('holding');clearTimeout(t);t=setTimeout(()=>{b.classList.remove('holding');act('take',b.dataset.v)},950)};
  const stop=()=>{b.classList.remove('holding');clearTimeout(t)};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('take',b.dataset.v)}});
  b.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ================= events ================= */
function act(a,v){
  let top=false;
  if(a&&a.startsWith('rk-')){
    if(a==='rk-open')ui.rank={tab:'rank',day:'all',cat:'all'};else if(a==='rk-close'){ui.rank=null;if(HAS_DOM&&location.hash==='#rank')history.replaceState(null,'',location.pathname+location.search)}
    else if(ui.rank){ui.rank.err=null;ui.rank.errKey=null;if(a==='rk-tab')ui.rank.tab=v;else if(a==='rk-day')ui.rank.day=v==='all'?'all':+v;else if(a==='rk-cat')ui.rank.cat=v}
    render();if(HAS_DOM&&a!=='rk-day'&&a!=='rk-cat')window.scrollTo(0,0);return;
  }
  if(a==='c-ava')C.avatar=+v;
  else if(a==='c-hand')C.hand=v;
  else if(a==='c-back')C.step=Math.max(0,C.step-1);
  else if(a==='c-next'){C.step++;top=true}
  else if(a==='c-pick')C.pick=+v;
  else if(a==='c-reroll'){C.cands=makeCands(C.pos);C.pick=0}
  else if(a==='c-focus'){const i=C.focus.indexOf(v);if(i>=0)C.focus.splice(i,1);else{if(C.focus.length>=2)C.focus.shift();C.focus.push(v)}}
  else if(a==='c-make')C.confirm=true;
  else if(a==='c-noconfirm')C.confirm=false;
  else if(a==='c-start'){C.confirm=false;newCareer();ui.tab='home';top=true}
  else if(a==='tab'){ui.tab=v;top=true}
  else if(a==='go-season'){ui.tab='season';top=true}
  else if(a==='go-player'){ui.tab='player';top=true}
  else if(a==='settings'){ui.sheet={type:'settings'};ui.settingsReset=false}
  else if(a==='close-sheet')ui.sheet=null;
  else if(a==='offer')ui.sheet={type:'offer',id:+v};
  else if(a==='take'){const x=S.off.offers[+v];ui.sheet=null;if(x)applyOffer(x);if(S.phase==='retired')top=true}
  else if(a==='reject'){S.off.offers.splice(+v,1);S.off.offers.forEach((x,i)=>x.id=i);ui.sheet=null;toast('제안을 거절했어요');if(!S.off.offers.length)S.off=buildOff()}
  else if(a==='reqtrade')requestTrade();
  else if(a==='tp')ui.sheet={type:'tp'};
  else if(a==='tp-pick')chooseTP(+v);
  else if(a==='nat')ui.sheet={type:'nat'};
  else if(a==='nat-pick'){S.nat.joined=v==='1';ui.sheet=null;if(S.nat.joined)addNews(`${S.name}, ${S.year} ${S.nat.ev} 대표팀 승선`,'nat');toast(S.nat.joined?'대표팀에 합류하기로 했어요':'소속팀에 남기로 했어요')}
  else if(a==='go'){
    if(S.off&&!S.off.decided){ui.tab='season';toast('오프시즌 결정을 먼저 해 주세요');top=true}
    else if(S.nat&&S.nat.joined==null)ui.sheet={type:'nat'};
    else{ui.sheet=null;startSeason();top=true}
  }
  else if(a==='mom')chooseMoment(+v);
  else if(a==='mom-skip'){const e=evPending(S.prog);if(e&&e.t==='mom'&&!e.done){e.done=true;e.ack=true}}
  else if(a==='ev-ok'||a==='mom-ok'){const e=evPending(S.prog);if(e&&e.done)e.ack=true}
  else if(a==='big-sim'){const e=evPending(S.prog);if(e&&e.t==='big'&&!e.done)resolveBig(e,bigSimWin(e))}
  else if(a==='big-play'){const e=evPending(S.prog);if(e&&e.t==='big'&&!e.done){S.play=newPlay(e);S.phase='play';top=true}}
  else if(a==='skip-next'){const P=S.prog;
    for(let g=0;g<8;g++){
      for(let i=1;i<3;i++){if(P.segs[i])continue;if(P.ev.some(x=>!x.done&&x.p<=SEG[i]+1e-9))break;rollSeg(i)}
      const nx=P.ev.filter(x=>!x.done).sort((x,y)=>x.p-y.p)[0];
      if(!nx){fastForward();finishSeason();top=true;break}
      P.p=Math.max(P.p,nx.p);const e=evPending(P);if(!e)continue;
      if(e.t==='mom'&&!e.done&&!momReady(P,e))continue;break}}
  else if(a==='skip'){fastForward();finishSeason();top=true}
  else if(a==='pg-start'){const G=S.play;if(G){SND.init();G.st=G.mode==='bat'?'pitching':'aim';PG.next=0;PG.an=null}}
  else if(a==='pg-tgt'){const G=S.play,[u,vv]=String(v).split(',').map(Number);if(G&&G.mode==='pit'&&(G.st==='aim'||G.st==='meter')){G.sel.u=u;G.sel.v=vv;if(G.st==='aim'){G.st='meter';PG.m0=performance.now()}}}
  else if(a==='pg-snd'){P3.snd=!P3.snd;try{localStorage.setItem('b2mvp_snd',P3.snd?'1':'0')}catch(e){}if(P3.snd)SND.init()}
  else if(a==='pg-assist'){P3.assist=!P3.assist;try{localStorage.setItem('b2mvp_assist',P3.assist?'1':'0')}catch(e){}}
  else if(a==='pg-type'){const G=S.play;if(G&&G.sel&&PTY[v])G.sel.type=v}
  else if(a==='pg-next'){const G=S.play;if(G&&G.st==='between')pgCont(G)}
  else if(a==='pg-auto'){const G=S.play;if(G&&!G.done){PG.rv=null;pgAuto(G)}}
  else if(a==='pg-done'){pgFinish();top=true}
  else if(a==='sum-ok'){S.phase=nextAfter('summary');ui.tab='home';top=true}
  else if(a==='award-ok'){S.last.awSeen=true;S.phase=nextAfter('award');ui.tab='home';top=true}
  else if(a==='world-ok'){S.last.world.seen=true;S.phase=nextAfter('world');ui.tab='home';top=true}
  else if(a==='nat-ok'){S.natRes=null;S.phase=nextAfter('nat');ui.tab='home';top=true}
  else if(a==='donate')ui.sheet={type:'donate'};
  else if(a==='copy-acct'){const txt=DONATE?(DONATE.copy||DONATE.acct):'', el=document.getElementById('acctno');
    const fb=()=>{if(el){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast('계좌번호를 선택했어요. 길게 눌러 복사해 주세요');render()};
    try{navigator.clipboard.writeText(txt).then(()=>{toast('계좌번호를 복사했어요');render()},fb)}catch(e){fb()}return}
  else if(a==='rec-tab')ui.recTab=v;
  else if(a==='rec-cat')ui.recCat=v;
  else if(a==='copy-exp'){const t=document.getElementById('exp'), txt=t?t.value:'';
    const fb=()=>{if(t){t.focus();t.select()}toast('코드가 선택됐어요. 길게 눌러 복사해 주세요');render()};
    try{navigator.clipboard.writeText(txt).then(()=>{toast('저장 코드를 복사했어요');render()},fb)}catch(e){fb()}return}
  else if(a==='do-imp'){const t=document.getElementById('imp');if(t&&importCode(t.value)){ui.sheet=null;ui.tab='home';toast('커리어를 불러왔어요')}else{toast('저장 코드를 확인해 주세요');render();return}}
  else if(a==='reset')ui.settingsReset=true;
  else if(a==='reset-no')ui.settingsReset=false;
  else if(a==='reset-yes'){ui.settingsReset=false;ui.sheet=null;S=null;try{localStorage.removeItem(KEY)}catch(e){}Object.assign(C,{step:0,cands:null,pick:0,focus:[],confirm:false});top=true}
  if(S)save();
  render();if(top&&HAS_DOM)window.scrollTo(0,0);
}
if(HAS_DOM){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.classList.contains('ov')&&e.target!==b)return;
    if(b.disabled)return;
    act(b.dataset.a,b.dataset.v);
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='c-pos'){C.pos=e.target.value;C.cands=null;C.pick=0;C.focus=[];render()}
    if(e.target.id==='c-school'){C.school=+e.target.value;render()}
  });
  document.addEventListener('input',e=>{if(e.target.id==='c-name')C.name=e.target.value;if(e.target.id==='c-num')C.num=e.target.value;
    if(e.target.id==='p3pow'){P3.bpow=clamp(+e.target.value/100,0,1);try{localStorage.setItem('b2mvp_bpow',String(P3.bpow))}catch(er){}const l=document.getElementById('p3powv');if(l)l.textContent=powLab(P3.bpow)}});
  document.addEventListener('keydown',e=>{
    if(S&&S.phase==='play'&&S.play&&(e.code==='Space'||e.key===' ')){const t=e.target;if(t&&(t.tagName==='BUTTON'&&t.dataset.a||t.tagName==='INPUT'))return;e.preventDefault();if(e.repeat)return;if(S.play.mode==='bat')pgSwing();else pgCharge();return}
    if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}});
  document.addEventListener('pointerdown',e=>{
    if(e.target.closest('#p3map')){e.preventDefault();PG.mapDrag=true;pgMapSet(e);return}
    const b=e.target.closest('[data-pg]');if(!b||b.disabled)return;e.preventDefault();if(b.dataset.pg==='swing')pgSwing();else if(b.dataset.pg==='throw')pgCharge()});
  document.addEventListener('pointermove',e=>{if(PG.mapDrag)pgMapSet(e)});
  const up=()=>{if(PG.mapDrag){PG.mapDrag=false}if(PG.charge)pgRelease()};
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  document.addEventListener('keyup',e=>{if((e.code==='Space'||e.key===' ')&&PG.charge)pgRelease()});
  const start=data=>{if(data&&data.S){S=migrate(data.S);fixState();if(data.C)Object.assign(C,data.C)}else load();if(location.hash==='#rank')ui.rank={tab:'rank',day:'all',cat:'all'};render()};
  window.claude?.hot?.snapshot?.(()=>({S,C:{...C}}));
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
